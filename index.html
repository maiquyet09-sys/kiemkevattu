<style>

<script>
"use strict";

function norm(s){return (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/\s+/g," ").trim();}

function parseNum(v){
  if(v===null||v===undefined||v==="")return 0;
  if(typeof v==="number")return v;
  var s=String(v).trim().replace(/\s/g,"");
  if(!s)return 0;
  var hasC=s.indexOf(",")>=0, hasD=s.indexOf(".")>=0;
  if(hasC&&hasD){
    if(s.lastIndexOf(",")>s.lastIndexOf("."))s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  }else if(hasC){
    var p=s.split(",");
    s=(p.length===2&&p[1].length<=2)?s.replace(",","."):s.replace(/,/g,"");
  }else if(hasD){
    var q=s.split(".");
    if(q.length>2||(q.length===2&&q[1].length===3))s=s.replace(/\./g,"");
  }
  var n=parseFloat(s);
  return isNaN(n)?0:n;
}
function fmt(n){
  if(n===null||n===undefined||n==="")return "";
  var x=Number(n);
  return isNaN(x)?String(n):new Intl.NumberFormat("vi-VN",{maximumFractionDigits:2}).format(x);
}
function soThanhChu(num){
  if(!num||isNaN(num)||num===0)return 'Không đồng';
  var isNeg=num<0; num=Math.abs(Math.round(num));
  var chuSo=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  var donVi=['','nghìn','triệu','tỷ'];
  function docBaSo(baso,forceTram){
    var tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),dv=baso%10;
    var s='';
    if(tram>0){s+=chuSo[tram]+' trăm ';}
    else if(forceTram){s+='không trăm ';}
    if(chuc>1){s+=chuSo[chuc]+' mươi ';if(dv===1)s+='mốt ';else if(dv===5)s+='lăm ';else if(dv>0)s+=chuSo[dv]+' ';}
    else if(chuc===1){s+='mười ';if(dv===1)s+='mốt ';else if(dv===5)s+='lăm ';else if(dv>0)s+=chuSo[dv]+' ';}
    else if(chuc===0&&dv>0){if(tram>0||forceTram)s+='linh ';s+=chuSo[dv]+' ';}
    return s.trim();
  }
  var groups=[];var n=num;
  if(n===0)groups=[0];else{while(n>0){groups.unshift(n%1000);n=Math.floor(n/1000);}}
  var parts=[];
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    if(g===0)continue;
    var s=docBaSo(g,i>0);
    var unitIdx=groups.length-1-i;
    parts.push(s+(donVi[unitIdx]?(' '+donVi[unitIdx]):''));
  }
  var result=parts.join(' ').replace(/\s+/g,' ').trim();
  result=result.charAt(0).toUpperCase()+result.slice(1);
  return (isNeg?'Âm ':'')+result+' đồng chẵn';
}
function daysTo(iso){
  if(!iso)return null;
  var d=new Date(iso+"T00:00:00");
  if(isNaN(d.getTime()))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function fmtDate(iso){if(!iso)return "";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function normKey(branch,code,name){return norm(branch)+"|"+(norm(code)||norm(name));}
function branchCode(name){
  var s=norm(name);
  s=s.replace(/^(kho|mdt|chi nhanh|cn)\s+/,'');
  s=s.split('-')[0];
  s=s.replace(/\d+/g,'');
  var words=s.trim().split(/\s+/).filter(Boolean);
  if(!words.length)return norm(name).slice(0,3).toUpperCase();
  return words.map(function(w){return w[0];}).join('').toUpperCase();
}
function diffOf(it){return (it.counted&&it.countQty!==null)?Math.round((it.countQty-it.close)*100)/100:null;}
function needsCount(it){return !it.counted&&it.close!==0;} /* mã tồn cuối = 0 thì mặc định không cần kiểm tay */

var KW={
  unit:[/^dvt$/,/don vi tinh/,/^don vi$/],
  open:[/ton dau/,/dau ky/],
  close:[/ton cuoi/,/cuoi ky/,/du cuoi/],
  "in":[/nhap/],
  out:[/xuat/],
  branch:[/chi nhanh/,/^kho( |$)/,/co so/,/ma kho/,/ten kho/],
  code:[/ma (so )?vat tu/,/ma vt/,/ma hang/,/^ma( so)?$/],
  name:[/ten vat tu/,/ten vt/,/ten hang/,/^ten$/,/ten/]
};
var ORDER=["unit","open","close","in","out","branch","code","name"];

function autoMap(headers){
  var H=headers.map(function(h){return norm(h);});
  var used={},map={};
  ORDER.forEach(function(f){
    var best=-1,bestScore=0;
    H.forEach(function(h,i){
      if(used[i]||!h)return;
      var hit=KW[f].some(function(re){return re.test(h);});
      if(hit){
        var sc=1;
        if(/so luong|(^| )sl( |$)/.test(h))sc+=1;
        if(/gia tri|thanh tien|(^| )gt( |$)|don gia|tien/.test(h))sc-=1;
        if(sc>bestScore){bestScore=sc;best=i;}
      }
    });
    if(best>=0&&bestScore>0){map[f]=best;used[best]=true;}
  });
  return map;
}
function detectHeaderRow(rows){
  var best=0,bestScore=0,n=Math.min(rows.length,20);
  for(var r=0;r<n;r++){
    var sc=0,row=rows[r]||[];
    for(var c=0;c<row.length;c++){
      var h=norm(row[c]);
      if(!h)continue;
      for(var f=0;f<ORDER.length;f++){
        if(KW[ORDER[f]].some(function(re){return re.test(h);})){sc++;break;}
      }
    }
    if(sc>bestScore){bestScore=sc;best=r;}
  }
  return bestScore>=3?best:0;
}
function colName(i){var s="";i++;while(i>0){s=String.fromCharCode(65+((i-1)%26))+s;i=Math.floor((i-1)/26);}return s;}

function buildItems(rows,start,map,branchManual,hsd){
  var out=[];
  function get(row,k){return map[k]===undefined?"":row[map[k]];}
  for(var r=start;r<rows.length;r++){
    var row=rows[r]||[];
    var name=String(get(row,"name")==null?"":get(row,"name")).trim();
    var code=String(get(row,"code")==null?"":get(row,"code")).trim();
    if(!name&&!code)continue;
    var nn=norm(name);
    if(nn.indexOf("tong cong")===0||nn==="cong"||nn.indexOf("tong so")===0)continue;
    var open=parseNum(get(row,"open"));
    var inn=parseNum(get(row,"in"));
    var outn=parseNum(get(row,"out"));
    var close=map.close!==undefined?parseNum(get(row,"close")):open+inn-outn;
    var branch=(map.branch!==undefined?String(get(row,"branch")==null?"":get(row,"branch")).trim():"")||branchManual.trim()||"Kho chính";
    var reg=hsd[normKey(branch,code,name)];
    var zeroStock=close===0; /* mã tồn cuối = 0: mặc định coi như đã kiểm khớp, khỏi cần đếm tay */
    out.push({
      id:"i"+r+"_"+out.length,branch:branch,code:code,name:name,
      unit:String(get(row,"unit")==null?"":get(row,"unit")).trim(),
      open:open,"in":inn,out:outn,close:close,
      counted:zeroStock,countQty:zeroStock?0:null,note:"",
      batches:reg?reg.batches.map(function(b){return {qty:b.qty,exp:b.exp};}):[]
    });
  }
  return out;
}

function dlAnchor(blob,fname){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);},4000);
    toast("Đã tải file — xem trong Tải xuống / app Tệp");
  }catch(e){console.error(e);toast("Trình duyệt chặn tải file — mở lại bằng Chrome/Safari");}
}
function shareOrDownload(blob,fname){
  var file=null;
  try{file=new File([blob],fname,{type:blob.type});}catch(e){file=null;}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:fname}).then(function(){
      toast("Đã xuất — chọn nơi lưu/gửi trong bảng chia sẻ");
    }).catch(function(err){
      if(err&&err.name==="AbortError"){toast("Đã hủy xuất file");return;}
      dlAnchor(blob,fname);
    });
    return;
  }
  dlAnchor(blob,fname);
}
function hsdRowsOf(p){
  var rows=[];
  p.items.forEach(function(it){
    (it.batches||[]).forEach(function(b){
      if(!b.exp)return;
      var d=daysTo(b.exp),bk=null;
      for(var i=0;i<BUCKETS.length;i++){if(BUCKETS[i].test(d)){bk=BUCKETS[i];break;}}
      rows.push([it.branch,it.code,it.name,it.unit,(b.qty===null||b.qty===undefined)?"":b.qty,fmtDate(b.exp),d,bk?bk.label:"Còn > 6 tháng"]);
    });
  });
  rows.sort(function(a,b){return a[6]-b[6];});
  return rows;
}

function buildBienBan(p){

  wb.calcProperties.fullCalcOnLoad=true;
  /* Tạo watermark PNG từ canvas */
  var wmId=null;
  try{
    var wc=document.createElement('canvas');
    wc.width=380;wc.height=210;
    var wctx=wc.getContext('2d');
    wctx.translate(190,105);
    wctx.rotate(-28*Math.PI/180);
    wctx.font='13px Arial,sans-serif';
    wctx.fillStyle='rgba(0,0,0,0.075)';
    wctx.textAlign='center';
    wctx.textBaseline='middle';
    wctx.fillText('Mai Văn Quyết quyetmv',0,0);
    var b64=wc.toDataURL('image/png').split(',')[1];

  }catch(e){wmId=null;}
  var d=new Date(p.createdAt);
  var thang=d.getMonth()+1,nam=d.getFullYear();
  var thin={style:"thin"};

  var branches=[];
  p.items.forEach(function(it){if(branches.indexOf(it.branch)<0)branches.push(it.branch);});

    s1.value="GIÁM ĐỐC CƠ SỞ";s1.font={name:"Times New Roman",size:11,bold:true};s1.alignment={horizontal:"center"};

    var px=cwArr.map(function(w){return w*7+5;});
    function anchorCol(c1,c2,imgW){
      var total=0,i2;
      for(i2=c1-1;i2<=c2-1;i2++)total+=px[i2];
      var off=Math.max(0,(total-imgW)/2),idx=c1-1;
      while(idx<c2-1&&off>px[idx]){off-=px[idx];idx++;}
      return idx+off/px[idx];
    }
    [[3,3,sgs.giamDoc],[6,7,sgs.thuKho],[10,11,sgs.hanhChinh]].forEach(function(z){
      var s=z[2];if(!s||!s.img)return;

        var imgId=wb.addImage({base64:s.img.split(",")[1],extension:"png"});
        ws.getRow(sr+1).height=Math.round(hh*0.75)+8;
        ws.addImage(imgId,{tl:{col:anchorCol(z[0],z[1],ww),row:sr+0.08},ext:{width:ww,height:hh}});
        if(z[1]>z[0]){ws.mergeCells(sr+2,z[0],sr+2,z[1]);ws.mergeCells(sr+3,z[0],sr+3,z[1]);}
        var nm=ws.getCell(sr+2,z[0]);
        nm.value=s.ten;nm.font={name:"Times New Roman",size:11,bold:true};nm.alignment={horizontal:"center"};

    });
    /* Tên người ký đã thiết lập theo chi nhánh (nếu chưa ký điện tử) */
    var sgn=sgOf(p.folder);
    [[3,3,'giamDoc'],[6,7,'thuKho'],[10,11,'hanhChinh']].forEach(function(z){
      if(sgs[z[2]]&&sgs[z[2]].img)return;
      var nm=sgn[z[2]];if(!nm)return;
      if(z[1]>z[0])ws.mergeCells(sr+5,z[0],sr+5,z[1]);
      var c=ws.getCell(sr+5,z[0]);
      c.value=nm;c.font={name:"Times New Roman",size:11,bold:true};c.alignment={horizontal:"center",wrapText:true};
    });
  });
  var hsd=hsdRowsOf(p);
  if(hsd.length){
    var ws2=wb.addWorksheet("HẠN SỬ DỤNG",{views:[{state:"frozen",ySplit:1}]});
    if(wmId!==null)try{ws2.addBackgroundImage(wmId);}catch(e){}
    [18,14.57,45,10,10,14,14,18].forEach(function(w,i){ws2.getColumn(i+1).width=w;});
    ["Chi nhánh/Kho","Mã hàng","Tên hàng","ĐVT","Số lượng","Hạn sử dụng","Còn lại (ngày)","Cảnh báo"].forEach(function(t,i){
      var cc=ws2.getCell(1,i+1);
      cc.value=t;
      cc.font={name:"Arial",size:10,bold:true};
      cc.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD8D8D8"}};
      cc.border=bAll;
      cc.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    });
    hsd.forEach(function(rw,i){
      rw.forEach(function(v,ci){

        cc.value=v;
        cc.font={name:"Times New Roman",size:11};
        cc.border=bAll;
      });
    });
  }
  addUnmSheet(wb,p);
  return wb;
}
function exportExcel(p){
  var fname=fileNameOf(p);
  if(typeof ExcelJS!=="undefined"){
    buildBienBan(p).xlsx.writeBuffer().then(function(buf){
      shareOrDownload(new Blob([buf],{type:XLSX_MIME}),fname);
    }).catch(function(e){console.error(e);exportExcelBasic(p,fname);});
    return;
  }
  exportExcelBasic(p,fname);
}
function exportExcelBasic(p,fname){
  if(typeof XLSX==="undefined"){toast("Chưa tải được thư viện Excel — kiểm tra kết nối mạng");return;}
  var rows=p.items.map(function(it,i){
    return {"STT":i+1,"Chi nhánh/Kho":it.branch,"Mã hàng":it.code,"Tên hàng":it.name,"ĐVT":it.unit,
      "Đầu kỳ":it.open,"Nhập kho":it["in"],"Xuất kho":it.out,"Cuối kỳ":it.close,
      "Kiểm kê":it.counted?it.countQty:"","Chênh":it.counted?diffOf(it):"","Ghi chú":it.note||""};
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Kiem ke");
  var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  shareOrDownload(new Blob([out],{type:XLSX_MIME}),fname);
}

var HHTM_CODES=["90000003","90000004","90000008","90000009","90000010","90000012","90000024","90000025","90000026","90000027","90000028","90000029","99000002"];
function readKiemKeXlsx(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var result=[];
      wb.SheetNames.forEach(function(sheetName){
        if(norm(sheetName).indexOf('han su dung')!==-1)return; /* bỏ qua sheet phụ HSD, không phải chi nhánh */
        var ws=wb.Sheets[sheetName];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        var branchName=sheetName;
        var row2=rows[1]?String(rows[1][0]||''):'';
        var mN=row2.match(/Kho:\s*(.+?),/);
        if(mN)branchName=mN[1].trim();
        var totalClose=0,totalKiem=0,hhtmItems=[];
        for(var r=4;r<rows.length;r++){
          var row=rows[r]||[];
          var code=String(row[1]||'').trim();
          var name=String(row[2]||'').trim();
          if(!name&&!code)continue;
          var nn=norm(name);
          if(nn.indexOf('tong cong')===0||nn==='cong')continue;
          var closeQty=parseNum(row[7]);
          var kiemQty=parseNum(row[8]);
          var note=String(row[10]||'').trim();
          var codeNorm=code.replace(/\.0+$/,'');
          var isHHTM=codeNorm&&HHTM_CODES.indexOf(codeNorm)!==-1;
          if(!isHHTM){
            totalClose+=closeQty;
            if(row[8]!==''&&row[8]!==null&&row[8]!==undefined)totalKiem+=kiemQty;
          }
          /* HHTM: chỉ lấy đúng các mã hàng trong danh sách HHTM_CODES, tính riêng ở mục III, không cộng vào tổng tồn/kiểm kê vật tư */
          if(isHHTM){
            hhtmItems.push({
              stt:String(hhtmItems.length+1),
              ten_hang:name,dvt:String(row[3]||''),
              sl_hang:closeQty?fmt(closeQty):'',
              kiem_ke:row[8]!==''&&row[8]!==null?fmt(kiemQty):''
            });
          }
        }
        result.push({name:branchName,totalClose:totalClose,totalKiem:totalKiem,hhtmItems:hhtmItems,fileName:file.name});
      });
      cb(null,result);
    }catch(err){cb(err,null);}
  };
  reader.readAsArrayBuffer(file);
}

  p.items.forEach(function(i){var b=i.branch||'';cnt[b]=(cnt[b]||0)+1;if(cnt[b]>bn){bn=cnt[b];best=b;}});

function toMhtml(html){
  var imgs=[];
  var out=html.replace(/src="data:(image\/[a-z+]+);base64,([^"]+)"/g,function(m,mime,b64){
    var n=imgs.length+1,ext=mime.split('/')[1].replace('jpeg','jpg');
    var loc='file:///C:/chuky'+n+'.'+ext;
    imgs.push({mime:mime,b64:b64,loc:loc});
    return 'src="'+loc+'"';
  });
  if(!imgs.length)return null;
  function wrap76(s){return s.replace(/(.{76})/g,'$1\r\n');}
  var bytes=new TextEncoder().encode(out),bin='';
  for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  var B='----=_NextPart_MD'+Date.now().toString(36);
  var s='MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="'+B+'"; type="text/html"\r\n\r\n';
  s+='--'+B+'\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/baocao.htm\r\n\r\n'+wrap76(btoa(bin))+'\r\n\r\n';
  imgs.forEach(function(im){
    s+='--'+B+'\r\nContent-Type: '+im.mime+'\r\nContent-Transfer-Encoding: base64\r\nContent-Location: '+im.loc+'\r\n\r\n'+wrap76(im.b64)+'\r\n\r\n';
  });
  return s+'--'+B+'--\r\n';
}
function exportDocHtml(html,fname){
  try{
    var mh=toMhtml(html);
    var blob=new Blob([mh!==null?mh:'\ufeff'+html],{type:'application/msword'+(mh!==null?'':';charset=utf-8')});
    var file=null;try{file=new File([blob],fname,{type:blob.type});}catch(er){}
    if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:fname}).catch(function(){dlAnchor(blob,fname);});
    }else{dlAnchor(blob,fname);}
    toast("✅ Đã tạo file — kiểm tra file vừa tải");
  }catch(err){console.error(err);toast("Lỗi tạo file: "+err.message);}
}

}
function sigPadOpen(kind,key,title,defName){
  SIGP={kind:kind,key:key,ink:false,drawing:false,minx:1e9,miny:1e9,maxx:-1e9,maxy:-1e9};
  var o=document.createElement('div');
  o.id='sigovl';
  o.innerHTML='<div class="sigcard">'
    +'<div style="font-weight:800;font-size:16px;margin-bottom:10px">Ký xác nhận: '+esc(title)+'</div>'
    +'<label class="lbl">Họ tên người ký</label><input class="inp" id="signame" value="'+esc(defName||'')+'" style="margin-bottom:10px">'
    +'<canvas id="sigcv"></canvas>'
    +'<div style="font-size:12px;color:var(--mut);margin:6px 0 12px">Dùng ngón tay vẽ chữ ký vào khung. Chữ ký sẽ được lưu kèm họ tên, thời gian và thiết bị.</div>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-outline" style="flex:1;padding:12px" onclick="sigPadClear()">Vẽ lại</button>'
    +'<button class="btn btn-outline" style="flex:1;padding:12px" onclick="sigPadClose()">Huỷ</button>'
    +'<button class="btn btn-primary" style="flex:1.3;padding:12px" onclick="sigConfirm()">'+icon('check',16)+'Xác nhận</button></div>'
    +'</div>';
  document.body.appendChild(o);
  document.body.style.overflow='hidden';
  var cv=document.getElementById('sigcv'),dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  var ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1d4ed8';
  SIGP.cv=cv;SIGP.ctx=ctx;SIGP.dpr=dpr;
  function pos(e){var b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  function box(p){SIGP.minx=Math.min(SIGP.minx,p.x);SIGP.miny=Math.min(SIGP.miny,p.y);SIGP.maxx=Math.max(SIGP.maxx,p.x);SIGP.maxy=Math.max(SIGP.maxy,p.y);}
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId);
    var p=pos(e);SIGP.drawing=true;SIGP.last=p;box(p);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.01,p.y+0.01);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  });
  cv.addEventListener('pointermove',function(e){
    if(!SIGP||!SIGP.drawing)return;e.preventDefault();
    var p=pos(e),m={x:(SIGP.last.x+p.x)/2,y:(SIGP.last.y+p.y)/2};
    ctx.quadraticCurveTo(SIGP.last.x,SIGP.last.y,m.x,m.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(m.x,m.y);SIGP.last=p;box(p);SIGP.ink=true;
  });
  var stop=function(){if(SIGP)SIGP.drawing=false;};
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);cv.addEventListener('pointerleave',stop);
}
function sigPadClear(){
  if(!SIGP)return;
  var cv=SIGP.cv;SIGP.ctx.clearRect(0,0,cv.width,cv.height);
  SIGP.ink=false;SIGP.minx=1e9;SIGP.miny=1e9;SIGP.maxx=-1e9;SIGP.maxy=-1e9;
}
function sigPadClose(){
  var o=document.getElementById('sigovl');if(o)o.remove();
  document.body.style.overflow='';SIGP=null;
}
function sigExport(){
  var d=SIGP.dpr,pad=10,cv=SIGP.cv;
  var x=Math.max(0,SIGP.minx-pad),y=Math.max(0,SIGP.miny-pad);
  var w=Math.min(cv.width/d-x,SIGP.maxx-SIGP.minx+pad*2),h=Math.min(cv.height/d-y,SIGP.maxy-SIGP.miny+pad*2);
  var ow=Math.min(Math.round(w*d),600),oh=Math.max(1,Math.round(h*d*(ow/(w*d))));
  var oc=document.createElement('canvas');oc.width=ow;oc.height=oh;
  oc.getContext('2d').drawImage(cv,x*d,y*d,w*d,h*d,0,0,ow,oh);
  return {url:oc.toDataURL('image/png'),w:ow,h:oh};
}

function chkLine(options,selArr,khacVal,khacLabel){
  /* render 1 dòng text tĩnh (không tương tác) dùng khi xuất doc: ☑/☐ */
  var parts=options.map(function(o){return (selArr&&selArr.indexOf(o)!==-1?'☑':'☐')+' '+esc(o);});
  if(khacLabel!==false)parts.push((khacVal&&khacVal.trim()?'☑':'☐')+' Khác: '+esc(khacVal||'..................'));

/* ================= Chọn kho gửi email cảnh báo HSD ================= */
function showHsdEmailPicker(){
  var entries=hsdEntries();
  var critical=entries.filter(function(e){return e.days<90;});
  if(!critical.length){toast("Không có vật tư nào cần cảnh báo (HSD còn > 3 tháng)");return;}
  var branchMap={};
  critical.forEach(function(e){
    var br=e.branch||"Kho chính";
    if(!branchMap[br])branchMap[br]=[];
    branchMap[br].push(e);
  });
  var branches=Object.keys(branchMap);
  if(branches.length===1){exportHsdAlert(branches[0]);return;}
  var h='<div class="ovl" id="ovl"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="shead"><div style="flex:1;min-width:0">'+
    '<div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4da6ff;margin-bottom:4px">GỬI EMAIL CẢNH BÁO HSD</div>'+
    '<div style="font-weight:700;font-size:16px;color:#f0f0f0">Chọn kho để gửi riêng</div>'+
    '<div style="font-size:12px;color:#6b7280;margin-top:3px">'+critical.length+' mã cần cảnh báo · '+branches.length+' kho</div>'+
    '</div><button class="sx" onclick="A.closeSheet()">✕</button></div>'+
    '<div style="padding:12px 20px 28px">'+
    '<button onclick="A.closeSheet();exportHsdAlert()" style="display:block;width:100%;border:1px solid rgba(77,166,255,.3);background:rgba(77,166,255,.07);color:#4da6ff;font:inherit;font-size:14px;font-weight:700;border-radius:14px;padding:13px;text-align:left;cursor:pointer;margin-bottom:10px">'+
    '📧 Tất cả kho — 1 email tổng hợp ('+critical.length+' mã)</button>'+
    '<div style="font-size:11px;color:#6b7280;text-align:center;margin-bottom:10px">── hoặc gửi riêng từng kho ──</div>';
  branches.forEach(function(br){
    var items=branchMap[br];
    var exp=items.filter(function(e){return e.days<0;}).length;
    var m1=items.filter(function(e){return e.days>=0&&e.days<=30;}).length;
    var m3=items.filter(function(e){return e.days>30&&e.days<=90;}).length;
    var badge='';
    if(exp>0)badge+=' 🔴 '+exp+' hết hạn';
    if(m1>0)badge+=' 🟠 '+m1+' <1th';
    if(m3>0)badge+=' 🟡 '+m3+' <3th';
    h+='<button onclick="A.closeSheet();exportHsdAlert(\''+esc(br)+'\')" style="display:block;width:100%;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#ffffff;font:inherit;font-size:14px;font-weight:600;border-radius:14px;padding:13px;text-align:left;cursor:pointer;margin-bottom:8px">'+
      '<div style="font-weight:700">'+esc(br)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-top:3px">'+items.length+' mã cần cảnh báo ·'+badge+'</div>'+
      '</button>';
  });
  h+='</div></div></div>';
  document.getElementById("modal").innerHTML=h;
  document.getElementById("ovl").addEventListener("click",function(e){if(e.target===this)A.closeSheet();});
}

/* ================= Mở email an toàn — tránh URL quá dài ================= */
function openMailtoSafe(subject,body){
  var url="mailto:?subject="+encodeURIComponent(subject);
  function doOpen(){window.location.href=url;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(body).then(function(){
      doOpen();
      setTimeout(function(){toast("✉ Đã mở soạn email — tiêu đề điền sẵn. Nhấn Ctrl+V (hoặc Dán) để điền nội dung.");},400);
    }).catch(function(){
      /* Clipboard thất bại — thử body ngắn */
      var short=body.length>500?body.substring(0,500)+"\n\n[...xem tiếp trong file đính kèm]":body;
      window.location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(short);
    });
  }else{
    var short=body.length>500?body.substring(0,500)+"\n\n[...xem tiếp trong file đính kèm]":body;
    window.location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(short);
  }
}

  var fname="CanhBao_HSD_"+(filterBranch?filterBranch.replace(/[^\w]/g,"_")+"_":"")+dateStr.replace(/\//g,"-")+".xlsx";

  var sg=p.sig||{},done=[],todo=[];
  SIG_KEYS.pe.forEach(function(k){
    var s=sg[k],t=SIG_TITLES['pe.'+k];
    if(s&&s.img)done.push('- '+t+': '+s.ten+', ký lúc '+s.time+' ('+s.dev+')');else todo.push(t);
  });
  if(!done.length)return '';
  var b=['✍ XÁC NHẬN CHỮ KÝ ĐIỆN TỬ','Biên bản kiểm kê đính kèm đã được ký xác nhận bằng chữ ký điện tử ngay trên ứng dụng Kiểm kê kho (thiết bị của người lập biên bản) bởi:'].concat(done);
  if(todo.length)b.push('Chưa ký điện tử: '+todo.join(', ')+'.');
  if(QUY_CHE_TEXT)b.push(QUY_CHE_TEXT);
  b.push('Đề nghị Quý anh/chị trả lời email này bằng câu: "Tôi xác nhận đã ký và đồng ý nội dung biên bản kiểm kê kỳ '+ky+'" trong vòng '+XAC_NHAN_HAN_NGAY+' ngày. Nếu không ký hoặc có ý kiến khác, vui lòng nêu rõ trong phản hồi.');

  if(typeof ExcelJS==="undefined"){
    openMailtoSafe(subject,body);
    return;
  }
  buildBienBan(p).xlsx.writeBuffer().then(function(buf){
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

    try{file=new File([blob],fname,{type:blob.type});}catch(e){}
    var shared=false;
    if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      shared=true;
      var shareText=subject+"\n\n"+body;
      navigator.share({files:[file],title:subject,text:shareText}).then(function(){
        toast("✉ Đã mở soạn email — kiểm tra tiêu đề và nội dung trước khi gửi");
      }).catch(function(err){

        dlAnchor(blob,fname);

      });
    }
    if(!shared){
      dlAnchor(blob,fname);
      setTimeout(function(){openMailtoSafe(subject,body);},900);
    }
  }).catch(function(e){console.error(e);toast("Không tạo được file báo cáo");});
}

function guessFolder(name){
  var m=String(name||'').trim().toUpperCase().match(/^(BTX|LVL|CL|QN|41ND)(?=[\s_\-.(]|$)/);
  if(!m)return '';
  var f={BTX:'Bùi Thị Xuân',LVL:'Lê Văn Lương',CL:'Cát Linh',QN:'Quảng Ninh','41ND':'Ba Đình-Nghĩa Dũng'}[m[1]];
  return db.folders.indexOf(f)>=0?f:'';
}
function migrateFolders(){
  if(!Array.isArray(db.folders))db.folders=DEFAULT_FOLDERS.slice();
  if(!db.barcodes||typeof db.barcodes!=='object')db.barcodes={};
  if(!db.ocrfix||typeof db.ocrfix!=='object')db.ocrfix={};
  if(!Array.isArray(db.assets))db.assets=[];
  if(!db.signers||typeof db.signers!=='object')db.signers={};
  db.periods.forEach(function(p){
    if(!p.folder){var g=guessFolder(p.name);if(g)p.folder=g;}
    if(p.folder&&db.folders.indexOf(p.folder)<0)db.folders.push(p.folder);
  });
}
function periodsIn(name){return db.periods.filter(function(p){return (p.folder||'')===name;});}

/* ================= Quét QR / mã vạch để khớp vật tư ================= */
var ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
var SC=null;
function parseGS1(t){
  var s=String(t||''),out={},m,found=false;
  if(/^\(\d{2}\)/.test(s)){
    var re=/\((\d{2,4})\)([^(]*)/g;
    while((m=re.exec(s))){out[m[1]]=m[2];found=true;}
  }else if(/^01\d{14}/.test(s)){
    var i=0;
    while(i<s.length){
      var ai=s.substr(i,2);
      if(ai==='01'){out['01']=s.substr(i+2,14);i+=16;found=true;}
      else if(ai==='17'||ai==='11'||ai==='15'){out[ai]=s.substr(i+2,6);i+=8;}
      else if(ai==='10'||ai==='21'){var j=s.indexOf('\u001d',i+2);if(j<0)j=s.length;out[ai]=s.substring(i+2,j);i=j+1;}
      else break;
    }
  }
  if(!found||!out['01'])return null;
  var r={gtin:out['01'],lot:out['10']||'',exp:''};
  var e=out['17']||'';
  if(e.length===6)r.exp=(2000+parseInt(e.substr(0,2),10))+'-'+e.substr(2,2);
  return r;
}
function scCanon(text){
  var t=String(text||'').trim(),g=parseGS1(t);
  if(g)return 'N:'+g.gtin.replace(/^0+/,'');
  if(/^\d{8,14}$/.test(t))return 'N:'+t.replace(/^0+/,'');
  return t;
}
function scHasCode(low,c){
  var digits=/^\d+$/.test(c),from=0,i;
  while((i=low.indexOf(c,from))>=0){
    var pv=i>0?low.charAt(i-1):'',nx=low.charAt(i+c.length);
    var bad=digits?(/\d/.test(pv)||/\d/.test(nx)):(/[a-z0-9]/.test(pv)||/[a-z0-9]/.test(nx));
    if(!bad)return true;
    from=i+1;
  }
  return false;
}
function scMatch(p,text){
  var t=String(text||'').replace(/\u001d/g,' ').trim(),g=parseGS1(text),canon=scCanon(text),byCode={};
  p.items.forEach(function(i){byCode[String(i.code).trim().toLowerCase()]=i;});
  var learned=db.barcodes&&db.barcodes[canon];
  if(learned&&byCode[String(learned).trim().toLowerCase()])return {item:byCode[String(learned).trim().toLowerCase()],how:'learned',gs1:g,canon:canon};
  var low=t.toLowerCase();
  if(byCode[low])return {item:byCode[low],how:'code',gs1:g,canon:canon};
  if(!g){
    var toks=low.split(/[^a-z0-9]+/).filter(Boolean);
    for(var k=0;k<toks.length;k++)if(byCode[toks[k]])return {item:byCode[toks[k]],how:'code',gs1:g,canon:canon};
    /* mã nằm lẫn trong chuỗi, ví dụ VT10000002, CCDC-00123-LVL, {"ma":"10000025"} */
    var best=null,bl=0;
    p.items.forEach(function(i){
      var c=String(i.code).trim().toLowerCase();
      if(c.length>=5&&c.length>bl&&scHasCode(low,c)){best=i;bl=c.length;}
    });
    if(best)return {item:best,how:'code',gs1:g,canon:canon};
  }
  return {item:null,gs1:g,canon:canon};
}
function scEnsureZx(){
  return new Promise(function(res){
    if(window.ZXing){res(true);return;}
    var sc=document.createElement('script');sc.src=ZX_URL;
    sc.onload=function(){res(!!window.ZXing);};sc.onerror=function(){res(false);};
    document.head.appendChild(sc);
  });
}
function scInitDecoder(){
  if('BarcodeDetector' in window){try{SC.det=new BarcodeDetector();return Promise.resolve(true);}catch(e){SC.det=null;}}
  return scEnsureZx();
}
function scDecodeZx(c){
  if(!window.ZXing)return null;
  try{
    if(!SC.zr){var hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);SC.zr=new ZXing.MultiFormatReader();SC.zr.setHints(hints);}
    var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
    return SC.zr.decode(bmp).getText();
  }catch(e){return null;}
}
function scDecode(c){
  if(SC.det){
    return SC.det.detect(c).then(function(r){return (r&&r.length)?r[0].rawValue:null;}).catch(function(){
      SC.det=null;return scEnsureZx().then(function(){return scDecodeZx(c);});
    });
  }
  return Promise.resolve(scDecodeZx(c));
}
function scInApp(){
  var ua=navigator.userAgent||'';
  if(/FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|Zalo|Line\/|Messenger/i.test(ua))return true;
  return /iPhone|iPad|iPod/.test(ua)&&!/Safari\//.test(ua)&&!navigator.standalone;
}
function scLoadImage(f){
  return new Promise(function(res,rej){
    function viaReader(){
      var fr=new FileReader();
      fr.onload=function(){var im=new Image();im.onload=function(){res({el:im,w:im.naturalWidth,h:im.naturalHeight});};im.onerror=function(){rej();};im.src=fr.result;};
      fr.onerror=function(){rej();};
      fr.readAsDataURL(f);
    }
    if(window.createImageBitmap){
      createImageBitmap(f).then(function(b){res({el:b,w:b.width,h:b.height});}).catch(viaReader);
    }else viaReader();
  });
}

/* Xoá các đường kẻ dài (viền bảng/khung nhãn) để không dính vào chữ số */

  for(x=0;x<w;x++){
    run=0;
    for(y=0;y<=h;y++){

  for(i=1;i<=a.length;i++){
    cur=[i];mn=i;
    for(j=1;j<=b.length;j++){
      v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1));
      cur[j]=v;if(v<mn)mn=v;

/* Xếp hạng vật tư theo độ giống của dãy số (chỉ so phần chữ số của mã) */
function ocrRank(p,lines){
  var res=[],fx=db.ocrfix||{};
  p.items.forEach(function(it){
    var cd=ocrDigits(it.code);
    if(cd.length<4)return;
    var best=99,bl='';
    lines.forEach(function(L){
      var d=L.digits,max=d.length>=9?3:d.length>=6?2:1,dist=(d===cd||(fx[d]&&String(fx[d]).toLowerCase()===String(it.code).toLowerCase()))?0:ocrLev(d,cd,max);
      if(dist<best){best=dist;bl=d;}
    });
    if(best<=3&&best<99){
      var L0=lines.filter(function(L){return L.digits===bl;})[0];
      var mx=bl.length>=9?3:bl.length>=6?2:1;
      if(best<=mx)res.push({item:it,dist:best,line:bl});
    }
  });
  res.sort(function(a,b){return a.dist-b.dist||String(a.item.code).localeCompare(String(b.item.code));});
  return res.slice(0,5);
}

function scAutoOcr(v){

  SC.sig=sig;

      vt.t=Date.now();

        SC.hold=true;

var RISK={key:'',set:null};
function scRisky(p,it){

function srcItemsOf(p,mode){
  var n=0;
  return p.items.map(function(i){
    var o=i.open,inn=i["in"],out=i.out,cl=i.close;
    if(mode==='next'){o=trAvail(i);inn=0;out=0;cl=o;}
    var zero=cl===0;
    n++;
    return {id:"i"+n+"_"+Math.random().toString(36).slice(2,6),branch:i.branch,code:i.code,name:i.name,unit:i.unit,
      open:o,"in":inn,out:out,close:cl,counted:zero,countQty:zero?0:null,note:"",
      batches:(i.batches||[]).map(function(b){return {qty:b.qty,exp:b.exp};})};
  });
}

/* ================= Màn hình kiểm kê ================= */
function baseList(p){
  var nq=norm(P.q);
  return p.items.filter(function(i){
    if(P.br!=="all"&&i.branch!==P.br)return false;
    if(nq&&norm(i.name).indexOf(nq)<0&&norm(i.code).indexOf(nq)<0)return false;
    return true;
  });
}
function filteredList(p){
  return baseList(p).filter(function(i){
    if(P.flt==="todo")return needsCount(i);
    if(P.flt==="done")return i.counted;
    if(P.flt==="diff")return i.counted&&diffOf(i)!==0;
    if(P.flt==="stock")return i.close>0;
    return true;
  });
}
function renderPeriod(){
  var p=per(P.id);
  if(!p){route={view:"home"};render();return;}
  var h='<div class="topbar"><div class="trow wrap">'+
    '<button class="back" onclick="A.periodBack()">‹</button>'+
    '<div class="ttl" style="cursor:text" title="Chạm để sửa tên" onclick="A.renamePeriod(\''+p.id+'\')">'+esc(p.name)+'</div>'+
    '<div style="display:flex;gap:6px;flex-shrink:0">'+
    '<button class="pill" title="Gửi email kết quả kiểm kê" style="display:inline-flex" onclick="A.kiemKeEmail()">'+icon('mail',15)+'</button>'+
    '<button class="pill" style="display:inline-flex;align-items:center;gap:5px" onclick="A.exportCur()">'+icon('download',15)+'Excel</button></div></div>'+
    '<div class="wrap" style="padding-top:10px"><div class="bar"><div class="fill" id="pfill"></div></div>'+
    '<div class="prow"><span id="pdone"></span><span id="pdiff"></span></div>'+

  document.getElementById("app").innerHTML=h;

function renderChips(p,base){
  var branches=[];
  p.items.forEach(function(i){if(i.branch&&branches.indexOf(i.branch)<0)branches.push(i.branch);});
  var cnt=function(k){
    return base.filter(function(i){
      if(k==="todo")return needsCount(i);
      if(k==="done")return i.counted;
      if(k==="stock")return i.close>0;
      return i.counted&&diffOf(i)!==0;
    }).length;
  };
  var h="";
  if(branches.length>1){
    h+='<select class="chip" onchange="A.setBr(this.value)"><option value="all"'+(P.br==="all"?" selected":"")+'>Tất cả kho</option>';
    branches.forEach(function(b){h+='<option value="'+esc(b)+'"'+(P.br===b?" selected":"")+'>'+esc(b)+'</option>';});
    h+='</select>';
  }
  [["all","Tất cả "+base.length],["todo","Chưa kiểm "+cnt("todo")],["stock","Còn tồn "+cnt("stock")],["diff","Chênh lệch "+cnt("diff")],["done","Đã kiểm "+cnt("done")]].forEach(function(c){
    h+='<button class="chip'+(P.flt===c[0]?" chip-on":"")+'" onclick="A.setFlt(\''+c[0]+'\')">'+c[1]+'</button>';
  });
  document.getElementById("chips").innerHTML=h;
}
function renderList(){
  var p=per(P.id);if(!p)return;
  var base=baseList(p);
  var list=base.filter(function(i){
    if(P.flt==="todo")return needsCount(i);
    if(P.flt==="done")return i.counted;
    if(P.flt==="diff")return i.counted&&diffOf(i)!==0;
    if(P.flt==="stock")return i.close>0;
    return true;
  });
  var total=p.items.length;
  var done=p.items.filter(function(i){return i.counted;}).length;
  var ndiff=p.items.filter(function(i){return i.counted&&diffOf(i)!==0;}).length;
  var pct=total?Math.round(done/total*100):0;
  var flist=filteredList(p);
  var fTodo=flist.filter(function(i){return needsCount(i);}).length;
  var allDone=flist.length>0&&fTodo===0;
  document.getElementById("pfill").style.width=pct+"%";
  document.getElementById("pdone").innerHTML='Đã kiểm <b class="tnum" style="color:var(--ink)">'+done+"/"+total+"</b> · "+pct+"%";
  document.getElementById("pdiff").innerHTML=ndiff>0?'<b style="color:var(--red)">'+ndiff+" mã chênh lệch</b>":"Chưa có chênh lệch";
  var exl=document.getElementById("exlink");
  if(exl){
    if(ndiff>0){exl.style.display="flex";exl.innerHTML=icon('edit',16)+'Làm phiếu giải trình ('+ndiff+' mã chênh lệch)'+icon('chev',16);}
    else exl.style.display="none";
  }
  document.getElementById("seqbtn").textContent=allDone?"✓ Hoàn tất — Xuất báo cáo Excel":"▶ Kiểm tuần tự · còn "+fTodo+" mã";
  renderChips(p,base);

  var branchesMulti=false;
  var seen={};
  for(var i=0;i<p.items.length;i++){seen[p.items[i].branch]=1;}
  branchesMulti=Object.keys(seen).length>1;

  var h="";
  if(!list.length)h='<div class="empty">Không có vật tư nào khớp bộ lọc.</div>';
  list.slice(0,P.limit).forEach(function(it){
    var d=diffOf(it);
    var worst=null;
    (it.batches||[]).forEach(function(b){var x=daysTo(b.exp);if(x!==null&&(worst===null||x<worst))worst=x;});
    var badges="";
    if(!it.counted)badges+='<span class="bdg">Chưa kiểm</span>';
    else if(d===0)badges+='<span class="bdg bdg-ok" style="display:inline-flex;align-items:center;gap:3px">'+icon('check',11)+'Khớp</span>';
    else if(d>0)badges+='<span class="bdg bdg-plus">+'+fmt(d)+' Thừa</span>';
    else badges+='<span class="bdg bdg-minus">−'+fmt(Math.abs(d))+' Thiếu</span>';
    if(worst!==null&&worst<=90){
      badges+='<span class="bdg '+(worst<0?"bdg-minus":worst<=30?"bdg-org":"bdg-plus")+'">HSD '+(worst<0?"quá hạn":"còn "+worst+"d")+'</span>';
    }
    if(it.photo)badges+='<span class="bdg" style="font-size:10px;display:inline-flex;align-items:center;gap:3px">'+icon('camera',11)+'Có ảnh</span>';
    var sub=[it.code,it.unit,branchesMulti?it.branch:null].filter(function(x){return x;}).map(esc).join(" · ");
    h+='<div class="item" onclick="A.openItem(\''+it.id+'\',false)">'+
      '<div style="flex:1;min-width:0"><div class="iname">'+esc(it.name)+'</div>'+
      '<div class="isub">'+sub+'</div><div class="ibadges">'+badges+'</div></div>'+
      '<div class="iright"><div class="iqty tnum">'+fmt(it.close)+'</div><div class="ilab">tồn cuối</div></div></div>';
  });
  if(list.length>P.limit){
    h+='<button class="addbat" style="display:block;width:100%;text-align:center;padding:12px 0" onclick="A.more()">Xem thêm ('+(list.length-P.limit)+' mã còn lại)</button>';
  }

function compressImg(file,maxPx,quality,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(1,maxPx/img.width,maxPx/img.height);
      var w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function tsLabel(ts){

  return p(d.getHours())+':'+p(d.getMinutes())+' ngày '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function mergeDb(d){
  var st={p:0,h:0,e:0};
  function add(dst,src,k){
    (src||[]).forEach(function(x){
      if(x&&x.id&&!dst.some(function(y){return y.id===x.id;})){dst.push(x);st[k]++;}
    });
    dst.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }
  add(db.periods,d.periods,'p');add(db.handovers,d.handovers,'h');add(db.explains,d.explains,'e');
  (d.folders||[]).forEach(function(f){if(f&&db.folders.indexOf(f)<0)db.folders.push(f);});
  Object.keys(d.barcodes||{}).forEach(function(k){if(!db.barcodes[k])db.barcodes[k]=d.barcodes[k];});
  if(!db.ocrfix)db.ocrfix={};
  Object.keys(d.ocrfix||{}).forEach(function(k){if(!db.ocrfix[k])db.ocrfix[k]=d.ocrfix[k];});
  migrateFolders();
  Object.keys(d.hsd||{}).forEach(function(k){if(!db.hsd[k])db.hsd[k]=d.hsd[k];});
  Object.keys(d.counters||{}).forEach(function(k){db.counters[k]=Math.max(db.counters[k]||0,d.counters[k]||0);});
  if(d.profile&&d.profile.ten&&!(db.profile&&db.profile.ten))db.profile=d.profile;
  if(!db.signers)db.signers={};
  Object.keys(d.signers||{}).forEach(function(k){if(!db.signers[k])db.signers[k]=d.signers[k];});
  return st;
}

   use:'Ô ký “Giám đốc cơ sở” (BB kiểm kê vật tư), “Lãnh đạo đơn vị” (BB kiểm kê CCDC & TSCĐ, phiếu giải trình)'},
  {k:'thuKho',label:'Thủ kho / Đầu mối kiểm kê',ph:'VD: Bà Đỗ Thị Quỳnh – Thủ kho kiêm quản lý kho',
   use:'Ô ký “Thủ kho cơ sở” (BB kiểm kê vật tư), “Đầu mối kiểm kê” (BB kiểm kê CCDC & TSCĐ), “Người kiểm kê” (báo cáo)'},
  {k:'hanhChinh',label:'Phòng Hành chính',ph:'VD: Bà Trần Thị B – Trưởng phòng Hành chính',
   use:'Ô ký “Phòng Hành chính Hậu cần” (BB kiểm kê vật tư), “Tổ kiểm kê” (BB kiểm kê CCDC & TSCĐ)'}
];
function sgOf(branch){
  var out={giamDoc:'',thuKho:'',hanhChinh:''},all=db.signers||{};
  var b=String(branch||'').trim()||(db.profile&&db.profile.chiNhanh)||'',n=norm(b),key=null;
  if(b&&all[b])key=b;
  else if(n)Object.keys(all).forEach(function(k){var nk=norm(k);if(!key&&nk&&(n.indexOf(nk)>=0||nk.indexOf(n)>=0))key=k;});
  if(key)SG_ROLES.forEach(function(r){out[r.k]=String(all[key][r.k]||'').trim();});
  if(!out.thuKho)out.thuKho=defaultNguoi(b);
  return out;
}
function sgBranches(){
  var seen={},out=[],add=function(x){x=String(x||'').trim();if(x&&!seen[x]){seen[x]=1;out.push(x);}};
  (db.folders||[]).forEach(add);
  var pc=String((db.profile&&db.profile.chiNhanh)||'').trim(),npc=norm(pc);
  if(pc&&!out.some(function(x){var nx=norm(x);return nx.indexOf(npc)>=0||npc.indexOf(nx)>=0;}))add(pc);
  Object.keys(db.signers||{}).forEach(add);
  return out;
}
function sgCount(b){var c=(db.signers||{})[b]||{},n=0;SG_ROLES.forEach(function(r){if(String(c[r.k]||'').trim())n++;});return n;}
function sgConfigured(){return Object.keys(db.signers||{}).some(function(b){return sgCount(b)>0;});}
var SGX={sel:'',
  pick:function(v){SGX.sel=v;renderSettings();},
  set:function(k,v){if(!SGX.sel)return;if(!db.signers)db.signers={};var c=db.signers[SGX.sel]=db.signers[SGX.sel]||{};c[k]=v;saveSoon();var e=document.getElementById('sg_cnt');if(e)e.textContent=sgCount(SGX.sel)+'/3';},
  copyHC:function(){
    var c=(db.signers||{})[SGX.sel]||{},v=String(c.hanhChinh||'').trim();
    if(!v){toast('Hãy nhập Phòng Hành chính trước');return;}
    if(!confirm('Dùng “'+v+'” làm Phòng Hành chính cho tất cả chi nhánh?'))return;
    sgBranches().forEach(function(b){db.signers[b]=db.signers[b]||{};db.signers[b].hanhChinh=v;});
    store.save();renderSettings();toast('Đã áp dụng cho tất cả chi nhánh');
  }
};

var ASQ=['Tốt','Trung bình','Kém','Hỏng'];
var ASST=['Đang sử dụng','Không sử dụng','Chờ thanh lý','Không tìm thấy'];
var AP={pid:null,q:'',flt:'all',limit:60,up:null,editing:null,editNew:false};
function asPer(id){var a=db.assets||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function asDiff(it){return it.counted?Math.round(((it.cQty||0)-(it.qty||0))*100)/100:null;}
function asDate(iso){var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(iso||'');}
function asIso(s){var m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):'';}
function asLocOf(room){var m=norm(room).match(/tang\s*(\d+)/);return m?'Tầng '+m[1]:'';}
function asRid(){return Math.random().toString(36).slice(2,7);}
function asStats(p){
  var s={total:p.items.length,qty:0,done:0,cq:0,ndiff:0,extra:0};
  p.items.forEach(function(i){
    s.qty+=i.qty||0;
    if(i.extra)s.extra++;
    if(i.counted){s.done++;s.cq+=i.cQty||0;if(asDiff(i)!==0)s.ndiff++;}
  });
  return s;
}
function asRooms(p){
  var seen={},out=[];
  p.items.forEach(function(i){if(i.room&&!seen[i.room]){seen[i.room]=1;out.push(i.room);}});
  return out.sort();
}
function asTeam(p){
  var t=p.team||{},g=sgOf(p.branch);
  return {dauMoi:t.dauMoi||g.thuKho,toKiemKe:t.toKiemKe||g.hanhChinh,lanhDao:t.lanhDao||g.giamDoc};
}
function asNextStt(p){var m=0;p.items.forEach(function(i){var n=parseInt(i.stt,10);if(n>m)m=n;});return m+1;}

/* ---- Đọc file Excel (Phần I bắt buộc, Phần II nếu có) ---- */
function asParseSheet(rows){
  var hr=-1,i,ns=null;
  for(i=0;i<Math.min(rows.length,30);i++){
    var t=rows[i].map(norm);
    if(t.some(function(x){return /^ma(\s|$)/.test(x);})&&t.some(function(x){return /^ten(\s|$)/.test(x);})){hr=i;ns=t;break;}
  }
  if(hr<0)return null;
  var col=function(fn){for(var j=0;j<ns.length;j++)if(fn(ns[j]))return j;return -1;};
  var C={
    stt:col(function(x){return x==='stt';}),
    code:col(function(x){return /^ma(\s|$)/.test(x);}),
    name:col(function(x){return /^ten(\s|$)/.test(x);}),
    unit:col(function(x){return x==='dvt'||/^don vi tinh/.test(x);}),
    qty:col(function(x){return /so luong/.test(x)&&!/kiem ke/.test(x);}),
    unit1:col(function(x){return /don vi cap/.test(x);}),
    cQty:col(function(x){return /so luong/.test(x)&&/kiem ke/.test(x);}),
    mgmt:col(function(x){return /don vi quan ly/.test(x);}),
    room:col(function(x){return /^phong/.test(x);}),
    user:col(function(x){return /nguoi su dung/.test(x);}),
    loc:col(function(x){return /^vi tri/.test(x);}),
    quality:col(function(x){return /pham chat/.test(x);}),
    status:col(function(x){return /tinh trang/.test(x);}),
    note:col(function(x){return /ghi chu/.test(x);})
  };
  var g=function(r,k){return C[k]>=0&&r[C[k]]!=null?String(r[C[k]]).trim():'';};
  var info={branch:'',dateCount:'',cutoff:''};
  for(i=0;i<hr;i++){
    rows[i].forEach(function(c){
      var s=String(c||'').trim(),n=norm(s);
      if(/^chi nhanh/.test(n)&&!info.branch)info.branch=s.replace(/^chi\s*nh[^\s]*\s*/i,'').trim();
      if(/kiem ke/.test(n)&&/thoi\s*diem/.test(n)&&!/chot/.test(n))info.dateCount=asIso(s);
      if(/chot/.test(n))info.cutoff=asIso(s);
    });
  }
  var items=[],n=0;
  for(i=hr+1;i<rows.length;i++){
    var r=rows[i],code=g(r,'code'),name=g(r,'name');
    if(!code&&!name)continue;
    if(/^tong/.test(norm(name))||/^tong/.test(norm(g(r,'stt'))))continue;
    n++;
    var qs=g(r,'qty'),cs=g(r,'cQty'),it={
      id:'a'+n+'_'+asRid(),stt:g(r,'stt')||String(n),code:code,name:name||code,unit:g(r,'unit'),
      qty:qs===''?1:(parseNum(qs)||0),unit1:g(r,'unit1'),counted:false,cQty:null,
      mgmt:g(r,'mgmt'),room:g(r,'room'),user:g(r,'user'),loc:g(r,'loc'),quality:g(r,'quality'),status:g(r,'status'),note:g(r,'note')
    };
    if(cs!==''){it.counted=true;it.cQty=parseNum(cs)||0;it.at=Date.now();it.by='(nhập từ file)';}
    items.push(it);
  }
  return {items:items,info:info};
}

function asRenderBody(){
  var p=asPer(AP.pid);if(!p||!document.getElementById('aslist'))return;

  document.getElementById('aspfill').style.width=pct+'%';
  document.getElementById('aspdone').innerHTML='Đã kiểm <b class="tnum" style="color:var(--ink)">'+s.done+'/'+s.total+'</b> · '+pct+'%';
  document.getElementById('aspdiff').innerHTML=(s.ndiff?'<b style="color:var(--red)">'+s.ndiff+' chênh lệch</b>':'Chưa có chênh lệch')+(s.extra?' · <b style="color:var(--green)">'+s.extra+' phát hiện thêm</b>':'');
  var flts={
    all:function(){return true;},
    todo:function(i){return !i.counted;},
    done:function(i){return i.counted;},
    diff:function(i){return i.counted&&asDiff(i)!==0;},
    bad:function(i){return i.counted&&(i.quality!=='Tốt'||i.status!=='Đang sử dụng');},
    extra:function(i){return i.extra;},
    trace:function(i){return i.trace;}
  };
  var chips=[['all','Tất cả'],['todo','Chưa kiểm'],['done','Đã kiểm'],['diff','Chênh lệch'],['bad','Hỏng/Không dùng'],['extra','Phát hiện thêm'],['trace','Cần dò tìm']],ch='';
  chips.forEach(function(c){
    var n=p.items.filter(flts[c[0]]).length;
    if(c[0]==='trace'&&!n)return;
    ch+='<button class="chip'+(AP.flt===c[0]?' chip-on':'')+'" onclick="ASX.flt(\''+c[0]+'\')">'+c[1]+' '+n+'</button>';
  });
  document.getElementById('aschips').innerHTML=ch;
  var nq=norm(AP.q||'');
  var list=p.items.filter(function(i){
    if(!flts[AP.flt](i))return false;
    return !nq||norm(i.name+' '+i.code+' '+i.room).indexOf(nq)>=0;
  });
  var h=list.length?'':'<div class="empty">Không có tài sản nào khớp bộ lọc.</div>';
  list.slice(0,AP.limit).forEach(function(it){
    var d=asDiff(it),b='';
    if(!it.counted)b+='<span class="bdg">Chưa kiểm</span>';
    else if(d===0)b+='<span class="bdg bdg-ok" style="display:inline-flex;align-items:center;gap:3px">'+icon('check',11)+'Khớp</span>';
    else if(d>0)b+='<span class="bdg bdg-plus">+'+fmt(d)+' Thừa</span>';
    else b+='<span class="bdg bdg-minus">−'+fmt(Math.abs(d))+' Thiếu</span>';
    if(it.counted&&it.quality&&it.quality!=='Tốt')b+='<span class="bdg bdg-minus">'+esc(it.quality)+'</span>';
    if(it.counted&&it.status&&it.status!=='Đang sử dụng')b+='<span class="bdg bdg-org">'+esc(it.status)+'</span>';
    if(it.extra)b+='<span class="bdg bdg-plus">Phát hiện thêm</span>';
    if(it.trace)b+='<span class="bdg bdg-org">Cần dò tìm</span>';
    var sub=[it.code,it.unit,it.counted&&it.room?it.room:null].filter(function(x){return x;}).map(esc).join(' · ');
    h+='<div class="item" onclick="ASX.edit(\''+it.id+'\')"><div style="flex:1;min-width:0"><div class="iname">'+esc(it.name)+'</div><div class="isub">'+sub+'</div><div class="ibadges">'+b+'</div></div>'
      +'<div class="iright"><div class="iqty tnum">'+fmt(it.counted?it.cQty:it.qty)+'</div><div class="ilab">'+(it.counted?'kiểm kê':'sổ sách')+'</div></div></div>';
  });
  if(list.length>AP.limit)h+='<button class="addbat" style="display:block;width:100%;text-align:center;padding:12px 0" onclick="ASX.more()">Xem thêm ('+(list.length-AP.limit)+' tài sản còn lại)</button>';
  document.getElementById('aslist').innerHTML=h;
}

  it.loc=v.loc||asLocOf(v.room);

  if(v.note!==undefined)it.note=v.note;

  p.cur=p.cur||{};

  if(v.user)p.cur.user=v.user;
  p.cur.loc=it.loc||p.cur.loc||'';

function asDefaults(p,it){

/* ================= Số quét chưa khớp: tự ghi nhận để đối chiếu sau ================= */
function eanOk(d){
  if(!/^\d+$/.test(d)||[8,12,13,14].indexOf(d.length)<0)return null;
  var sum=0,n=d.length,i;
  for(i=0;i<n-1;i++)sum+=(+d.charAt(i))*(((n-2-i)%2===0)?3:1);
  return ((10-sum%10)%10)===(+d.charAt(n-1));
}
function unmList(p){if(!p.unm)p.unm=[];return p.unm;}
function unmOpenCount(p){return (p&&p.unm?p.unm:[]).filter(function(e){return e.st==='open';}).length;}
function unmKeyOf(text){var t=String(text||'').trim();return /^[\d\s.,-]+$/.test(t)?ocrDigits(t):t.toLowerCase();}
function unmAdd(p,text,kind,n){
  var key=unmKeyOf(text),L=unmList(p),now=Date.now(),e=null;
  L.forEach(function(x){if(!e&&x.key===key)e=x;});
  if(e){e.n+=(n||1);e.last=now;saveSoon();return {e:e,isNew:false};}
  e={id:'u'+now.toString(36)+Math.random().toString(36).slice(2,5),key:key,text:String(text).trim(),kind:kind,n:n||1,first:now,last:now,st:'open',by:(db.profile&&db.profile.ten)||''};
  L.push(e);saveSoon();return {e:e,isNew:true};
}
function unmBannerHtml(p){
  if(typeof asPer==='function'&&asPer(p.id)){
    var nt=p.items.filter(function(i){return i.trace;}).length;
    if(!nt)return '';
    return '<button class="stklink" style="display:flex;align-items:center;gap:7px;color:var(--red)" onclick="ASX.flt(\'trace\')">⚑ '+nt+' tài sản chưa có trong sổ, cần dò tìm'+icon('chev',16)+'</button>';
  }
  var n=unmOpenCount(p);
  if(!n)return '';
  return '<button class="stklink" style="display:flex;align-items:center;gap:7px;color:var(--red)" onclick="unmOpen(\''+p.id+'\')">⚑ '+n+' số quét chưa khớp, bấm để đối chiếu'+icon('chev',16)+'</button>';
}
function scUnmChip(){
  var e=document.getElementById('scunm');if(!e||!SC)return;
  var p=per(SC.pid),n,lab;
  if(SC.kind==='asset'){n=p.items.filter(function(i){return i.trace;}).length;lab='⚑ Cần dò tìm: ';}
  else{n=unmOpenCount(p);lab='⚑ Chưa khớp: ';}
  e.style.display=n?'block':'none';
  e.textContent=lab+n;
}
function scTrack(lines){
  var now=Date.now(),T=(SC.trk||[]).filter(function(c){return now-c.t<6000;});
  lines.forEach(function(L){
    var d=L.digits;if(d.length<6||d.length>20)return;
    var c=null;
    T.forEach(function(x){if(!c&&(x.rep===d||(x.rep.length===d.length&&ocrLev(x.rep,d,1)<=1)))c=x;});
    if(!c){c={rep:d,cnt:{},n:0,t:now,done:false};T.push(c);}
    c.cnt[d]=(c.cnt[d]||0)+1;c.n++;c.t=now;
    var best=d;Object.keys(c.cnt).forEach(function(k){if(c.cnt[k]>c.cnt[best])best=k;});c.rep=best;
  });
  SC.trk=T;return T;
}

function asAutoAdd(p,text,kind){

  p.items.forEach(function(x){if(!it&&unmKeyOf(x.code)===key)it=x;});

  var c=p.cur||{},now=Date.now();
  it={id:'x_'+now.toString(36)+Math.random().toString(36).slice(2,5),stt:String(asNextStt(p)),code:code,name:'(Chưa rõ tên) '+code.slice(0,40),unit:'Cái',qty:0,
    unit1:(p.items[0]&&p.items[0].unit1)||'',counted:true,cQty:1,mgmt:(p.items[0]&&p.items[0].unit1)||'',
    room:c.room||'',user:c.user||'Sử dụng chung',loc:c.loc||asLocOf(c.room),quality:'Tốt',status:'Đang sử dụng',
    note:'Quét thấy nhưng chưa có trong sổ, cần dò tìm',extra:true,trace:true,at:now,by:(db.profile&&db.profile.ten)||''};
  p.items.push(it);saveSoon();

function unmFind(eid){var p=per(UNM.pid),r=null;unmList(p).forEach(function(e){if(e.id===eid)r=e;});return r;}

function unmQ(eid,v){
  var p=per(UNM.pid),n=norm(v),out='',c=0;
  if(n)p.items.forEach(function(i){if(c<8&&(norm(i.name).indexOf(n)>=0||norm(i.code).indexOf(n)>=0)){c++;out+=unmItemBtn(eid,i,'');}});
  var r=document.getElementById('unmres_'+eid);if(r)r.innerHTML=out||(n?'<div style="font-size:12px;color:var(--mut);margin-top:6px">Không có kết quả.</div>':'');

function unmLink(eid,itemId){
  var p=per(UNM.pid),e=unmFind(eid),it=null;
  p.items.forEach(function(x){if(x.id===itemId)it=x;});
  if(!e||!it)return;
  e.st='linked';e.item=it.id;e.itemCode=it.code;e.itemName=it.name;e.doneAt=Date.now();
  var dg=ocrDigits(e.text);
  if(/^[\d\s.,-]+$/.test(e.text)&&dg&&dg!==ocrDigits(it.code)){if(!db.ocrfix)db.ocrfix={};db.ocrfix[dg]=it.code;}
  if(e.kind==='code'){if(!db.barcodes)db.barcodes={};db.barcodes[scCanon(e.text)]=it.code;}
  store.save();
  toast('Đã liên kết với '+it.name);
  var isAsset=!!(typeof asPer==='function'&&asPer(p.id));
  unmClose();
  if(isAsset){AP.pid=p.id;asEdit(it.id);}
  else{if(SC)A.scClose();openSheet(it.id,false);}
}
function unmIgnore(eid){var e=unmFind(eid);if(!e)return;e.st='ignored';e.doneAt=Date.now();saveSoon();unmRender();}
function unmReopen(eid){var e=unmFind(eid);if(!e)return;e.st='open';saveSoon();unmRender();}
function unmExtra(eid){
  var e=unmFind(eid),p=per(UNM.pid);if(!e)return;
  e.st='extra';e.doneAt=Date.now();saveSoon();
  unmClose();AP.pid=p.id;ASX.addExtra(e.text.slice(0,60));
}
function addUnmSheet(wb,p){
  var L=(p.unm||[]);if(!L.length)return;
  var ws=wb.addWorksheet('CHƯA KHỚP'),st={open:'Chưa xử lý',linked:'Đã liên kết',ignored:'Bỏ qua',extra:'Ngoài sổ'};
  var heads=['STT','Nội dung quét','Loại','Số lần thấy','Lần đầu','Lần cuối','Trạng thái','Mã liên kết','Tên liên kết'];
  [6,28,12,12,20,20,14,20,40].forEach(function(w,i){ws.getColumn(i+1).width=w;});
  heads.forEach(function(t,j){var c=ws.getCell(1,j+1);c.value=t;c.font={name:'Times New Roman',size:11,bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E2F3'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};});
  L.slice().sort(function(a,b){return a.first-b.first;}).forEach(function(e,k){
    var row=[k+1,e.text,e.kind==='ocr'?'Đọc số':'Quét mã',e.n,new Date(e.first).toLocaleString('vi-VN'),new Date(e.last).toLocaleString('vi-VN'),st[e.st]||e.st,e.itemCode||'',e.itemName||''];
    row.forEach(function(v,j){var c=ws.getCell(k+2,j+1);c.value=v;c.font={name:'Times New Roman',size:11};c.alignment={vertical:'middle',wrapText:true,horizontal:j===1||j>=7?'left':'center'};});
  });
  ws.views=[{state:'frozen',ySplit:1}];
}

  scPhoto:function(input){
    var f=input.files&&input.files[0];input.value='';
    if(!f||!SC)return;
    scMsg('Đang đọc ảnh…');
    var info=(f.type||'không rõ định dạng')+', '+Math.round(f.size/1024)+' KB';
    scLoadImage(f).then(function(im){
      if(!SC)return;
      var go=function(){
        var tryScale=function(maxSide){
          var k=Math.min(1,maxSide/Math.max(im.w,im.h));
          var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.w*k));c.height=Math.max(1,Math.round(im.h*k));
          c.getContext('2d').drawImage(im.el,0,0,c.width,c.height);
          return scDecode(c);
        };
        tryScale(1600).then(function(t){return t||tryScale(900);}).then(function(t){return t||tryScale(2400);}).then(function(txt){
          if(!SC)return;
          if(txt){scMsg('Đã đọc ảnh');scOnCode(txt,true);}
          else scOcrProcess(im.el,{x:0,y:0,w:im.w,h:im.h});
        });
      };
      if(!SC.det&&!window.ZXing)scEnsureZx().then(go);else go();
    }).catch(function(){scMsg('Không mở được ảnh ('+info+'). Thử chụp lại hoặc nhập số.');});
  },

  key:function(k){
    if(!SB)return;
    var s=SB.qtyStr||"";
    if(k==="back"){s=s.slice(0,-1);}
    else if(k==="clear"){s="";}
    else if(k==="match"){s=String(Math.round(SB._close*100)/100);}
    else if(k==="+1"||k==="-1"){
      var base=s===""?SB._close:parseNum(s);
      var nv=base+(k==="+1"?1:-1);
      if(nv<0)nv=0;
      s=String(Math.round(nv*100)/100);
    }else if(k==="."){
      if(s.indexOf(".")<0)s=(s===""?"0":s)+".";
    }else{
      if(s==="0")s=k;
      else if(s.length<12){
        var dot=s.indexOf(".");
        if(!(dot>=0&&s.length-dot-1>=2))s=s+k;
      }
    }
    SB.qtyStr=s;
    A.calc();
  },
  calc:function(){
    if(!SB)return;
    var disp=document.getElementById("sqtydisp");
    var qv=(SB.qtyStr||"").trim();
    if(disp){disp.textContent=qv===""?"0":qv;disp.classList.toggle("qtydisp-empty",qv==="");}
    var note=document.getElementById("snote").value.trim();
    var ban=document.getElementById("sban");
    var lbl=document.getElementById("snotelbl");
    var hint=document.getElementById("snotehint");
    var qn=qv===""?null:parseNum(qv);
    var diff=qn===null?null:Math.round((qn-SB._close)*100)/100;
    if(diff===null){ban.innerHTML="";}
    else if(diff===0){ban.innerHTML='<div class="ban ban-ok">✓ Khớp tồn kho sổ sách</div>';}
    else if(diff>0){ban.innerHTML='<div class="ban ban-plus">▲ THỪA '+fmt(diff)+" "+esc(SB._unit||"")+' so với sổ sách</div>';}
    else{ban.innerHTML='<div class="ban ban-minus">▼ THIẾU '+fmt(Math.abs(diff))+" "+esc(SB._unit||"")+' so với sổ sách</div>';}
    var needNote=diff!==null&&diff!==0&&!note;
    lbl.textContent="Ghi chú / giải trình"+(diff!==null&&diff!==0?" (bắt buộc)":"");
    lbl.style.color=needNote?"#f87171":"";
    hint.innerHTML=needNote?'<div class="hint-red">Có chênh lệch — bắt buộc nhập nguyên nhân trước khi lưu.</div>':"";
    var can=qn!==null&&!needNote;
    document.getElementById("ssave").disabled=!can;
    document.getElementById("snext").disabled=!can;
  },
  bat:function(i,k,v){SB.batches[i][k]=v;if(k==="exp")renderBatches();},
  noteQuick:function(i){
    var text=QUICK_NOTES[i];
    if(text===undefined)return;
    var ta=document.getElementById("snote");
    if(!ta)return;
    var cur=ta.value.trim();
    if(!cur){ta.value=text;}
    else if(cur.indexOf(text)<0){ta.value=cur+"; "+text;}
    A.calc();
  },
  batAdd:function(){SB.batches.push({qty:"",exp:""});renderBatches();},
  batDel:function(i){SB.batches.splice(i,1);renderBatches();},
  photoTake:function(input){
    var f=input.files&&input.files[0];if(!f)return;
    input.value="";
    compressImg(f,1600,0.9,function(b64){SB.photo=b64;renderPhotoSec();});
  },
  photoClear:function(){SB.photo=null;renderPhotoSec();},
  sheetSave:function(advance){
    if(!SB)return;
    var p=per(P.id);if(!p)return;
    var it=null;
    for(var i=0;i<p.items.length;i++)if(p.items[i].id===SB.itemId){it=p.items[i];break;}
    if(!it)return;
    var qv=(SB.qtyStr||"").trim();
    if(qv===""){toast("Nhập số lượng kiểm kê");return;}
    var qn=parseNum(qv);
    var note=document.getElementById("snote").value.trim();
    var diff=Math.round((qn-it.close)*100)/100;
    if(diff!==0&&!note){toast("Bắt buộc nhập giải trình khi có chênh lệch");return;}
    var batches=SB.batches.filter(function(b){return b.exp;}).map(function(b){
      return {qty:(b.qty===""?null:parseNum(b.qty)),exp:b.exp};
    });
    var updated={};
    Object.keys(it).forEach(function(k){updated[k]=it[k];});
    updated.counted=true;updated.countQty=qn;updated.note=note;updated.batches=batches;
    updated.photo=SB.photo||null;
    updated.by=(db.profile&&db.profile.ten)||'';updated.at=Date.now();
    var wasSeq=SB.seq,savedId=SB.itemId;
    applyItem(updated);
    if(advance){
      var flist=filteredList(p);
      var idx=-1;
      for(var j=0;j<flist.length;j++)if(flist[j].id===savedId){idx=j;break;}
      var next=null;
      for(var k2=1;k2<=flist.length;k2++){
        var cand=flist[(idx+k2)%flist.length];
        if(!cand.counted&&cand.id!==savedId){next=cand;break;}
      }
      if(next){openSheet(next.id,true);}
      else{
        A.closeSheet();
        toast("Đã kiểm xong 100% ✓ — xuất Excel để lưu hồ sơ");
      }
    }else{
      A.closeSheet();
      toast("Đã lưu");
    }
  },
  sheetReset:function(){
    if(!SB)return;
    var p=per(P.id);if(!p)return;
    var it=null;
    for(var i=0;i<p.items.length;i++)if(p.items[i].id===SB.itemId){it=p.items[i];break;}
    if(!it)return;
    var updated={};
    Object.keys(it).forEach(function(k){updated[k]=it[k];});
    updated.counted=false;updated.countQty=null;
    applyItem(updated);
    A.closeSheet();
    toast('Đã đưa về "chưa kiểm"');
  }
};

/* ================= Init ================= */
/* ================= Tự động kiểm tra bản mới ================= */
var APP_VERSION=(document.querySelector&&document.querySelector('meta[name="app-version"]'))?document.querySelector('meta[name="app-version"]').content:'';
var UPD_SHOWN=false;
function showUpdateBanner(newVer){
  if(UPD_SHOWN)return;
  UPD_SHOWN=true;
  var d=document.createElement('div');
  d.id='updbanner';
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:#2f6fed;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.2)';
  d.innerHTML='<span>Có bản cập nhật mới</span>'
    +'<button style="border:none;background:#fff;color:#2f6fed;font:inherit;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer" onclick="reloadLatest(\''+newVer+'\')">Tải lại ngay</button>'
    +'<button style="border:none;background:none;color:rgba(255,255,255,.8);font:inherit;cursor:pointer" onclick="document.getElementById(\'updbanner\').remove()">Để sau</button>';
  document.body.appendChild(d);
}
function reloadLatest(ver){
  var base=location.href.split('#')[0].split('?')[0];
  location.href=base+'?v='+encodeURIComponent(ver||Date.now());
}
function checkForUpdate(){
  if(!APP_VERSION||!window.fetch||location.protocol==='file:')return;
  var base=location.href.split('#')[0].split('?')[0];
  fetch(base+'?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.text():'';})
    .then(function(t){
      var m=t&&t.match(/<meta name="app-version" content="([^"]+)"/);
      if(m&&m[1]!==APP_VERSION)showUpdateBanner(m[1]);
    })
    .catch(function(){});
}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
setTimeout(checkForUpdate,4000);
setInterval(checkForUpdate,5*60*1000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkForUpdate();});

(function(){
  var saved=store.load();
  if(saved&&saved.periods)db=saved;
  if(!db.handovers)db.handovers=[];
  if(!db.explains)db.explains=[];
  migrateFolders();
  store.save();
  if(!db.counters)db.counters={};
  if(!db.profile)db.profile={ten:'',chucVu:'',chiNhanh:'',ma:'',maManual:false};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
  /* Watermark */
  try{
    var W=300,H=170;
    var c=document.createElement('canvas');
    c.width=W;c.height=H;
    var ctx=c.getContext('2d');
    ctx.translate(W/2,H/2);
    ctx.rotate(-28*Math.PI/180);
    ctx.font='12.5px Arial,sans-serif';
    ctx.fillStyle='rgba(0,0,0,0.072)';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('Mai Văn Quyết quyetmv',0,0);
    var url=c.toDataURL('image/png');
    var wm=document.createElement('div');
    wm.style.cssText='position:fixed;inset:0;z-index:9000;pointer-events:none;background-image:url('+url+');background-repeat:repeat;background-size:'+W+'px '+H+'px';
    document.body.appendChild(wm);
  }catch(e){}
})();
</script>
