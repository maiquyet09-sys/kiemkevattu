/* ===== UI v2: MedDental xanh, điều hướng dưới, quét QR ===== */
:root{--bg:#eef3fb;--card2:#eaf1fc;--ink:#0f172a;--mut:rgba(15,23,42,.6);--line:rgba(15,40,90,.1);
  --teal:#0f5bd8;--teal-d:#0a46b0;--teal-bg:rgba(15,91,216,.09);--teal-ln:rgba(15,91,216,.28);
  --navy:#0a47b3;--header-h:76px;--nav-h:66px}
body{background:var(--bg)}
.card{border-radius:18px;border-color:transparent;box-shadow:0 1px 3px rgba(15,40,90,.06),0 6px 20px rgba(15,40,90,.05)}
.btn{border-radius:14px}

    if(chuc>1){s+=chuSo[chuc]+' mươi ';if(dv===1)s+='mốt ';else if(dv===5)s+='lăm ';else if(dv>0)s+=chuSo[dv]+' ';}
    else if(chuc===1){s+='mười ';if(dv===1)s+='mốt ';else if(dv===5)s+='lăm ';else if(dv>0)s+=chuSo[dv]+' ';}
    else if(chuc===0&&dv>0){if(tram>0||forceTram)s+='linh ';s+=chuSo[dv]+' ';}
    return s.trim();
  }
  var groups=[];var n=num;
  if(n===0)groups=[0];else{while(n>0){groups.unshift(n%1000);n=Math.floor(n/1000);}}
  var parts=[];
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    if(g===0)continue;
    var s=docBaSo(g,i>0);
    var unitIdx=groups.length-1-i;
    parts.push(s+(donVi[unitIdx]?(' '+donVi[unitIdx]):''));
  }
  var result=parts.join(' ').replace(/\s+/g,' ').trim();
  result=result.charAt(0).toUpperCase()+result.slice(1);
  return (isNeg?'Âm ':'')+result+' đồng chẵn';
}
function daysTo(iso){
  if(!iso)return null;
  var d=new Date(iso+"T00:00:00");
  if(isNaN(d.getTime()))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function fmtDate(iso){if(!iso)return "";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function normKey(branch,code,name){return norm(branch)+"|"+(norm(code)||norm(name));}
function branchCode(name){
  var s=norm(name);
  s=s.replace(/^(kho|mdt|chi nhanh|cn)\s+/,'');
  s=s.split('-')[0];
  s=s.replace(/\d+/g,'');
  var words=s.trim().split(/\s+/).filter(Boolean);
  if(!words.length)return norm(name).slice(0,3).toUpperCase();
  return words.map(function(w){return w[0];}).join('').toUpperCase();
}

var KW={
  unit:[/^dvt$/,/don vi tinh/,/^don vi$/],
  open:[/ton dau/,/dau ky/],
  close:[/ton cuoi/,/cuoi ky/,/du cuoi/],
  "in":[/nhap/],
  out:[/xuat/],
  branch:[/chi nhanh/,/^kho( |$)/,/co so/,/ma kho/,/ten kho/],
  code:[/ma (so )?vat tu/,/ma vt/,/ma hang/,/^ma( so)?$/],
  name:[/ten vat tu/,/ten vt/,/ten hang/,/^ten$/,/ten/]
};
var ORDER=["unit","open","close","in","out","branch","code","name"];

function autoMap(headers){
  var H=headers.map(function(h){return norm(h);});
  var used={},map={};
  ORDER.forEach(function(f){
    var best=-1,bestScore=0;
    H.forEach(function(h,i){
      if(used[i]||!h)return;
      var hit=KW[f].some(function(re){return re.test(h);});
      if(hit){
        var sc=1;
        if(/so luong|(^| )sl( |$)/.test(h))sc+=1;
        if(/gia tri|thanh tien|(^| )gt( |$)|don gia|tien/.test(h))sc-=1;
        if(sc>bestScore){bestScore=sc;best=i;}
      }
    });
    if(best>=0&&bestScore>0){map[f]=best;used[best]=true;}
  });
  return map;
}
function detectHeaderRow(rows){
  var best=0,bestScore=0,n=Math.min(rows.length,20);
  for(var r=0;r<n;r++){
    var sc=0,row=rows[r]||[];
    for(var c=0;c<row.length;c++){
      var h=norm(row[c]);
      if(!h)continue;
      for(var f=0;f<ORDER.length;f++){
        if(KW[ORDER[f]].some(function(re){return re.test(h);})){sc++;break;}
      }
    }
    if(sc>bestScore){bestScore=sc;best=r;}
  }
  return bestScore>=3?best:0;
}

function buildItems(rows,start,map,branchManual,hsd){
  var out=[];
  function get(row,k){return map[k]===undefined?"":row[map[k]];}
  for(var r=start;r<rows.length;r++){
    var row=rows[r]||[];
    var name=String(get(row,"name")==null?"":get(row,"name")).trim();
    var code=String(get(row,"code")==null?"":get(row,"code")).trim();
    if(!name&&!code)continue;
    var nn=norm(name);
    if(nn.indexOf("tong cong")===0||nn==="cong"||nn.indexOf("tong so")===0)continue;
    var open=parseNum(get(row,"open"));
    var inn=parseNum(get(row,"in"));
    var outn=parseNum(get(row,"out"));
    var close=map.close!==undefined?parseNum(get(row,"close")):open+inn-outn;
    var branch=(map.branch!==undefined?String(get(row,"branch")==null?"":get(row,"branch")).trim():"")||branchManual.trim()||"Kho chính";
    var reg=hsd[normKey(branch,code,name)];
    
    out.push({
      id:"i"+r+"_"+out.length,branch:branch,code:code,name:name,
      unit:String(get(row,"unit")==null?"":get(row,"unit")).trim(),
      open:open,"in":inn,out:outn,close:close,
      counted:false,countQty:null,note:"",
      batches:reg?reg.batches.map(function(b){return {qty:b.qty,exp:b.exp};}):[]
    });
  }
  return out;
}

var HHTM_CODES=["90000003","90000004","90000008","90000009","90000010","90000012","90000024","90000025","90000026","90000027","90000028","90000029","99000002"];
function readKiemKeXlsx(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var result=[];
      wb.SheetNames.forEach(function(sheetName){
        if(norm(sheetName).indexOf('han su dung')!==-1)return; /* bỏ qua sheet phụ HSD, không phải chi nhánh */
        var ws=wb.Sheets[sheetName];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        var branchName=sheetName;
        var row2=rows[1]?String(rows[1][0]||''):'';
        var mN=row2.match(/Kho:\s*(.+?),/);
        if(mN)branchName=mN[1].trim();
        var totalClose=0,totalKiem=0,hhtmItems=[];
        for(var r=4;r<rows.length;r++){
          var row=rows[r]||[];
          var code=String(row[1]||'').trim();
          var name=String(row[2]||'').trim();
          if(!name&&!code)continue;
          var nn=norm(name);
          if(nn.indexOf('tong cong')===0||nn==='cong')continue;
          var closeQty=parseNum(row[7]);
          var kiemQty=parseNum(row[8]);
          var note=String(row[10]||'').trim();
          var codeNorm=code.replace(/\.0+$/,'');
          var isHHTM=codeNorm&&HHTM_CODES.indexOf(codeNorm)!==-1;
          if(!isHHTM){
            totalClose+=closeQty;
            if(row[8]!==''&&row[8]!==null&&row[8]!==undefined)totalKiem+=kiemQty;
          }
          /* HHTM: chỉ lấy đúng các mã hàng trong danh sách HHTM_CODES, tính riêng ở mục III, không cộng vào tổng tồn/kiểm kê vật tư */
          if(isHHTM){
            hhtmItems.push({
              stt:String(hhtmItems.length+1),
              ten_hang:name,dvt:String(row[3]||''),
              sl_hang:closeQty?fmt(closeQty):'',
              kiem_ke:row[8]!==''&&row[8]!==null?fmt(kiemQty):''
            });
          }
        }
        result.push({name:branchName,totalClose:totalClose,totalKiem:totalKiem,hhtmItems:hhtmItems,fileName:file.name});
      });
      cb(null,result);
    }catch(err){cb(err,null);}
  };
  reader.readAsArrayBuffer(file);
}

var BCSRC={sel:{}};
function periodCounted(p){var n=0;p.items.forEach(function(i){if(i.counted&&i.countQty!==null)n++;});return n;}
function bcBranchOfPeriod(p){
  if(p.folder)return p.folder;
  var cnt={},best='',bn=0;
  p.items.forEach(function(i){var b=i.branch||'';cnt[b]=(cnt[b]||0)+1;if(cnt[b]>bn){bn=cnt[b];best=b;}});
  return (best||p.name).replace(/^kho\s+/i,'');
}
function bcFromPeriod(p){
  var totalClose=0,totalKiem=0,hh=[];
  p.items.forEach(function(i){
    var code=String(i.code||'').replace(/\.0+$/,'');
    var done=i.counted&&i.countQty!==null;
    if(code&&HHTM_CODES.indexOf(code)!==-1){
      hh.push({stt:String(hh.length+1),ten_hang:i.name,dvt:i.unit||'',sl_hang:i.close?fmt(i.close):'',kiem_ke:done?fmt(i.countQty):''});
    }else{
      totalClose+=i.close;
      if(done)totalKiem+=i.countQty;
    }
  });
  return {name:bcBranchOfPeriod(p),totalClose:totalClose,totalKiem:totalKiem,hhtmItems:hh,fileName:'Hồ sơ kiểm kê: '+p.name,periodId:p.id};
}

function toMhtml(html){
  var imgs=[];
  var out=html.replace(/src="data:(image\/[a-z+]+);base64,([^"]+)"/g,function(m,mime,b64){
    var n=imgs.length+1,ext=mime.split('/')[1].replace('jpeg','jpg');
    var loc='file:///C:/chuky'+n+'.'+ext;
    imgs.push({mime:mime,b64:b64,loc:loc});
    return 'src="'+loc+'"';
  });
  if(!imgs.length)return null;
  function wrap76(s){return s.replace(/(.{76})/g,'$1\r\n');}
  var bytes=new TextEncoder().encode(out),bin='';
  for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  var B='----=_NextPart_MD'+Date.now().toString(36);
  var s='MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="'+B+'"; type="text/html"\r\n\r\n';
  s+='--'+B+'\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/baocao.htm\r\n\r\n'+wrap76(btoa(bin))+'\r\n\r\n';
  imgs.forEach(function(im){
    s+='--'+B+'\r\nContent-Type: '+im.mime+'\r\nContent-Transfer-Encoding: base64\r\nContent-Location: '+im.loc+'\r\n\r\n'+wrap76(im.b64)+'\r\n\r\n';
  });
  return s+'--'+B+'--\r\n';
}
function exportDocHtml(html,fname){
  try{
    var mh=toMhtml(html);
    var blob=new Blob([mh!==null?mh:'\ufeff'+html],{type:'application/msword'+(mh!==null?'':';charset=utf-8')});
    var file=null;try{file=new File([blob],fname,{type:blob.type});}catch(er){}
    if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:fname}).catch(function(){dlAnchor(blob,fname);});
    }else{dlAnchor(blob,fname);}
    toast("✅ Đã tạo file — kiểm tra file vừa tải");
  }catch(err){console.error(err);toast("Lỗi tạo file: "+err.message);}
}
function printPreviewHtml(html){
  try{
    var printable=html.replace('<style>'+DOC_STYLE,'<style>body{margin:24px auto;max-width:21cm;}@media print{body{margin:0}}'+DOC_STYLE);
    var blob=new Blob([printable],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var w=window.open(url,'_blank');
    if(!w){toast('Trình duyệt chặn mở tab mới — cho phép popup rồi thử lại');return;}
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }catch(err){console.error(err);toast('Không mở được bản xem trước: '+err.message);}
}

    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.01,p.y+0.01);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  });
  cv.addEventListener('pointermove',function(e){
    if(!SIGP||!SIGP.drawing)return;e.preventDefault();
    var p=pos(e),m={x:(SIGP.last.x+p.x)/2,y:(SIGP.last.y+p.y)/2};
    ctx.quadraticCurveTo(SIGP.last.x,SIGP.last.y,m.x,m.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(m.x,m.y);SIGP.last=p;box(p);SIGP.ink=true;
  });
  var stop=function(){if(SIGP)SIGP.drawing=false;};
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);cv.addEventListener('pointerleave',stop);
}
function sigPadClear(){
  if(!SIGP)return;
  var cv=SIGP.cv;SIGP.ctx.clearRect(0,0,cv.width,cv.height);
  SIGP.ink=false;SIGP.minx=1e9;SIGP.miny=1e9;SIGP.maxx=-1e9;SIGP.maxy=-1e9;
}
function sigPadClose(){
  var o=document.getElementById('sigovl');if(o)o.remove();
  document.body.style.overflow='';SIGP=null;
}
function sigExport(){
  var d=SIGP.dpr,pad=10,cv=SIGP.cv;
  var x=Math.max(0,SIGP.minx-pad),y=Math.max(0,SIGP.miny-pad);
  var w=Math.min(cv.width/d-x,SIGP.maxx-SIGP.minx+pad*2),h=Math.min(cv.height/d-y,SIGP.maxy-SIGP.miny+pad*2);
  var ow=Math.min(Math.round(w*d),600),oh=Math.max(1,Math.round(h*d*(ow/(w*d))));
  var oc=document.createElement('canvas');oc.width=ow;oc.height=oh;
  oc.getContext('2d').drawImage(cv,x*d,y*d,w*d,h*d,0,0,ow,oh);
  return {url:oc.toDataURL('image/png'),w:ow,h:oh};
}

/* ---- Xác thực chữ ký bằng Face ID / vân tay (WebAuthn, khoá nằm trên thiết bị) ---- */
function waOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create&&window.isSecureContext);}
function waRand(n){return crypto.getRandomValues(new Uint8Array(n));}
function waB64(b){var a=new Uint8Array(b),s='',i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function waUn(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function waEnroll(ten){
  var nm=ten||'Người kiểm kê';
  return navigator.credentials.create({publicKey:{challenge:waRand(32),rp:{name:'Kiểm kê kho MedDental',id:location.hostname},user:{id:waRand(16),name:nm,displayName:nm},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}})
    .then(function(c){db.webauthn={id:waB64(c.rawId),at:Date.now()};store.save();});
}
function waSign(ten){
  if(!db.webauthn)return waEnroll(ten);
  return navigator.credentials.get({publicKey:{challenge:waRand(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:waUn(db.webauthn.id),transports:['internal']}],userVerification:'required',timeout:60000}});
}
function sigConfirm(){
  if(!SIGP)return;
  var ten=(document.getElementById('signame').value||'').trim();
  if(!SIGP.ink){toast('Chưa có chữ ký, hãy vẽ vào khung');return;}
  if(!ten){toast('Nhập họ tên người ký');return;}
  var chk=document.getElementById('sigwa'),useWa=!!(chk&&chk.checked);
  if(chk){db.waPref=useWa;saveSoon();}
  var fin=function(auth){
    if(!SIGP)return;
    var ex=sigExport();
    var sig={img:ex.url,w:ex.w,h:ex.h,ten:ten,time:nowLabel(),dev:deviceLabel()};
    if(auth)sig.auth=auth;
    var kind=SIGP.kind,key=SIGP.key;
    sigPadClose();
    var S=sigStore(kind);S.sig=S.sig||{};S.sig[key]=sig;
    if(kind==='as')asLog(S,'Ký điện tử: '+(SIG_TITLES['as.'+key]||key),null,ten+(auth?' · '+auth:''));
    sigPersist(kind);
    sigRerender(kind);
    toast(auth?'Đã ký và xác thực':'Đã ký xác nhận');
  };
  if(!useWa){fin('');return;}
  waSign(ten).then(function(){db.waFail=0;fin('Xác thực thiết bị (Face ID/vân tay/mã máy)');}).catch(function(e){
    db.waFail=(db.waFail||0)+1;
    if(db.waFail>=2){db.webauthn=null;db.waFail=0;}
    store.save();
    toast('Chưa xác thực được'+(e&&e.name==='NotAllowedError'?' (đã huỷ hoặc không khớp)':'')+' — thử lại, hoặc bỏ chọn xác thực để ký thường');
  });
}

/* ================= Chọn kho gửi email cảnh báo HSD ================= */
function showHsdEmailPicker(){
  var entries=hsdEntries();
  var critical=entries.filter(function(e){return e.days<90;});
  if(!critical.length){toast("Không có vật tư nào cần cảnh báo (HSD còn > 3 tháng)");return;}
  var branchMap={};
  critical.forEach(function(e){
    var br=e.branch||"Kho chính";
    if(!branchMap[br])branchMap[br]=[];
    branchMap[br].push(e);
  });
  var branches=Object.keys(branchMap);
  if(branches.length===1){exportHsdAlert(branches[0]);return;}
  var h='<div class="ovl" id="ovl"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="shead"><div style="flex:1;min-width:0">'+
    '<div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4da6ff;margin-bottom:4px">GỬI EMAIL CẢNH BÁO HSD</div>'+
    '<div style="font-weight:700;font-size:16px;color:#f0f0f0">Chọn kho để gửi riêng</div>'+
    '<div style="font-size:12px;color:#6b7280;margin-top:3px">'+critical.length+' mã cần cảnh báo · '+branches.length+' kho</div>'+
    '</div><button class="sx" onclick="A.closeSheet()">✕</button></div>'+
    '<div style="padding:12px 20px 28px">'+
    '<button onclick="A.closeSheet();exportHsdAlert()" style="display:block;width:100%;border:1px solid rgba(77,166,255,.3);background:rgba(77,166,255,.07);color:#4da6ff;font:inherit;font-size:14px;font-weight:700;border-radius:14px;padding:13px;text-align:left;cursor:pointer;margin-bottom:10px">'+
    '📧 Tất cả kho — 1 email tổng hợp ('+critical.length+' mã)</button>'+
    '<div style="font-size:11px;color:#6b7280;text-align:center;margin-bottom:10px">── hoặc gửi riêng từng kho ──</div>';
  branches.forEach(function(br){
    var items=branchMap[br];
    var exp=items.filter(function(e){return e.days<0;}).length;
    var m1=items.filter(function(e){return e.days>=0&&e.days<=30;}).length;
    var m3=items.filter(function(e){return e.days>30&&e.days<=90;}).length;
    var badge='';
    if(exp>0)badge+=' 🔴 '+exp+' hết hạn';
    if(m1>0)badge+=' 🟠 '+m1+' <1th';
    if(m3>0)badge+=' 🟡 '+m3+' <3th';
    h+='<button onclick="A.closeSheet();exportHsdAlert(\''+esc(br)+'\')" style="display:block;width:100%;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#ffffff;font:inherit;font-size:14px;font-weight:600;border-radius:14px;padding:13px;text-align:left;cursor:pointer;margin-bottom:8px">'+
      '<div style="font-weight:700">'+esc(br)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-top:3px">'+items.length+' mã cần cảnh báo ·'+badge+'</div>'+
      '</button>';
  });
  h+='</div></div></div>';
  document.getElementById("modal").innerHTML=h;
  document.getElementById("ovl").addEventListener("click",function(e){if(e.target===this)A.closeSheet();});
}

/* ================= Mở email an toàn — tránh URL quá dài ================= */
function openMailtoSafe(subject,body){
  var url="mailto:?subject="+encodeURIComponent(subject);
  function doOpen(){window.location.href=url;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(body).then(function(){
      doOpen();
      setTimeout(function(){toast("✉ Đã mở soạn email — tiêu đề điền sẵn. Nhấn Ctrl+V (hoặc Dán) để điền nội dung.");},400);
    }).catch(function(){
      /* Clipboard thất bại — thử body ngắn */
      var short=body.length>500?body.substring(0,500)+"\n\n[...xem tiếp trong file đính kèm]":body;
      window.location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(short);
    });
  }else{
    var short=body.length>500?body.substring(0,500)+"\n\n[...xem tiếp trong file đính kèm]":body;
    window.location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(short);
  }
}

function exportHsdAlert(filterBranch){
  var entries=hsdEntries();

    return e.days<90&&(!filterBranch||norm(e.branch)===norm(filterBranch));
  });
  if(!critical.length){toast("Không có vật tư nào cần cảnh báo"+(filterBranch?" tại "+filterBranch:""));return;}
  var now=new Date();
  var dateStr=String(now.getDate()).padStart(2,"0")+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();
  /* Nội dung email */
  /* Đếm theo từng mức */
  /* Phân loại theo mức */
  var expired=critical.filter(function(e){return e.days<0;});
  var nearExpiry=critical.filter(function(e){return e.days>=0;});
  var SO_NGAY=90;
  var hanXuLyDate=new Date(now.getTime()+3*24*60*60*1000);
  var hanXuLy=String(hanXuLyDate.getDate()).padStart(2,"0")+"/"+String(hanXuLyDate.getMonth()+1).padStart(2,"0")+"/"+hanXuLyDate.getFullYear();

  var lines=[];

  lines.push("");

  if(expired.length){

    });

  if(nearExpiry.length){
    lines.push("");
    lines.push("⚠️ DANH SÁCH HÀNG CẬN DATE (ƯU TIÊN XUẤT TRƯỚC)");
    nearExpiry.forEach(function(e){
      lines.push(e.name+" ("+(e.code||"—")+") — Lô: — | SL: "+fmtQty(e)+" | HSD: "+fmtDate(e.exp)+" (Còn "+e.days+" ngày)");

  lines.push("(Email tự động, vui lòng không phản hồi trực tiếp)\nMAI VĂN QUYẾT - CHUYÊN VIÊN HÀNH CHÍNH\nCÔNG TY CỔ PHẦN NỤ CƯỜI MỚI VIỆT NAM");
  var body=lines.join("\n");
  var subject="[MedDental] CẢNH BÁO hạn sử dụng vật tư"+(filterBranch?" – "+filterBranch:"")+" – "+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();
  var fname="CanhBao_HSD_"+(filterBranch?filterBranch.replace(/[^\w]/g,"_")+"_":"")+dateStr.replace(/\//g,"-")+".xlsx";
  /* Nếu không có ExcelJS thì mở mailto luôn */
  if(typeof ExcelJS==="undefined"){
    openMailtoSafe(subject,body);
    return;
  }
  var wb=new ExcelJS.Workbook();

  [22,14,45,8,10,14,16,18].forEach(function(w,i){ws.getColumn(i+1).width=w;});
  var thin={style:"thin"},bAll={top:thin,left:thin,bottom:thin,right:thin};

  tc.value="CẢNH BÁO HẠN SỬ DỤNG VẬT TƯ – MEDDENTAL";

  dc.value="Ngày lập: "+dateStr+" · "+critical.length+" mã cần xử lý";
  dc.font={name:"Arial",size:10,italic:true};dc.alignment={horizontal:"center"};
  ws.getRow(2).height=15;

  ["Chi nhánh/Kho","Mã hàng","Tên hàng","ĐVT","Số lượng","Hạn sử dụng","Còn lại (ngày)","Cảnh báo"].forEach(function(t,i){

  /* Màu theo mức cảnh báo */
  var bgMap={expired:"FFFFD6D6",m1:"FFFFE8CC",m3:"FFFFFACD"};
  critical.forEach(function(e,i){
    var r=4+i,bk=null;
    for(var j=0;j<BUCKETS.length;j++){if(BUCKETS[j].test(e.days)){bk=BUCKETS[j];break;}}
    var argb=(bk&&bgMap[bk.k])?bgMap[bk.k]:"FFEEEEEE";
    var fill={type:"pattern",pattern:"solid",fgColor:{argb:argb}};
    [e.branch,e.code,e.name,e.unit,
      (e.qty===null||e.qty===undefined||e.qty===""?"":e.qty),

  try{

  wb.xlsx.writeBuffer().then(function(buf){

/* Cấu hình câu chữ trong email xác nhận chữ ký. QUY_CHE_TEXT chỉ điền khi công ty đã thực sự ban hành quy chế,

var QUY_CHE_TEXT='';
var XAC_NHAN_HAN_NGAY=3;
function sigConfirmBlock(p,ky){
  var sg=p.sig||{},done=[],todo=[];
  SIG_KEYS.pe.forEach(function(k){
    var s=sg[k],t=SIG_TITLES['pe.'+k];
    if(s&&s.img)done.push('- '+t+': '+s.ten+', ký lúc '+s.time+' ('+s.dev+')');else todo.push(t);
  });
  if(!done.length)return '';
  var b=['✍ XÁC NHẬN CHỮ KÝ ĐIỆN TỬ','Biên bản kiểm kê đính kèm đã được ký xác nhận bằng chữ ký điện tử ngay trên ứng dụng Kiểm kê kho (thiết bị của người lập biên bản) bởi:'].concat(done);
  if(todo.length)b.push('Chưa ký điện tử: '+todo.join(', ')+'.');
  if(QUY_CHE_TEXT)b.push(QUY_CHE_TEXT);
  b.push('Đề nghị Quý anh/chị trả lời email này bằng câu: "Tôi xác nhận đã ký và đồng ý nội dung biên bản kiểm kê kỳ '+ky+'" trong vòng '+XAC_NHAN_HAN_NGAY+' ngày. Nếu không ký hoặc có ý kiến khác, vui lòng nêu rõ trong phản hồi.');
  return b.join('\n');

/* ================= Quét QR / mã vạch để khớp vật tư ================= */
var ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
var SC=null;
function parseGS1(t){
  var s=String(t||''),out={},m,found=false;
  if(/^\(\d{2}\)/.test(s)){
    var re=/\((\d{2,4})\)([^(]*)/g;
    while((m=re.exec(s))){out[m[1]]=m[2];found=true;}
  }else if(/^01\d{14}/.test(s)){
    var i=0;
    while(i<s.length){
      var ai=s.substr(i,2);
      if(ai==='01'){out['01']=s.substr(i+2,14);i+=16;found=true;}
      else if(ai==='17'||ai==='11'||ai==='15'){out[ai]=s.substr(i+2,6);i+=8;}
      else if(ai==='10'||ai==='21'){var j=s.indexOf('\u001d',i+2);if(j<0)j=s.length;out[ai]=s.substring(i+2,j);i=j+1;}
      else break;
    }
  }
  if(!found||!out['01'])return null;
  var r={gtin:out['01'],lot:out['10']||'',exp:''};
  var e=out['17']||'';
  if(e.length===6)r.exp=(2000+parseInt(e.substr(0,2),10))+'-'+e.substr(2,2);
  return r;
}
function scCanon(text){
  var t=String(text||'').trim(),g=parseGS1(t);
  if(g)return 'N:'+g.gtin.replace(/^0+/,'');
  if(/^\d{8,14}$/.test(t))return 'N:'+t.replace(/^0+/,'');
  return t;
}
function scHasCode(low,c){
  var digits=/^\d+$/.test(c),from=0,i;
  while((i=low.indexOf(c,from))>=0){
    var pv=i>0?low.charAt(i-1):'',nx=low.charAt(i+c.length);
    var bad=digits?(/\d/.test(pv)||/\d/.test(nx)):(/[a-z0-9]/.test(pv)||/[a-z0-9]/.test(nx));
    if(!bad)return true;
    from=i+1;
  }
  return false;
}
var SCIDX={p:null,n:-1,m:null};
function scIndex(p){
  if(SCIDX.p!==p||SCIDX.n!==p.items.length||SCIDX.m===null){
    var m=Object.create(null);
    p.items.forEach(function(i,x){var k=String(i.code).trim().toLowerCase();(m[k]||(m[k]=[])).push(x);});
    SCIDX={p:p,n:p.items.length,m:m};
  }
  return SCIDX.m;
}
/* mã trùng ở nhiều kho: ưu tiên kho đang chọn; chưa chọn kho mà mã có ở nhiều kho thì trả về ds để người dùng chọn */
function scPickItem(p,k,ix){
  var l=ix[k];if(!l)return null;
  var arr=l.map(function(x){return p.items[x];}).filter(function(i){return i&&String(i.code).trim().toLowerCase()===k;});
  if(!arr.length){SCIDX.m=null;return null;}
  var br=(P&&P.id===p.id)?P.br:"all";
  if(br&&br!=="all"){var in1=arr.filter(function(i){return i.branch===br;});return in1.length?{item:in1[0]}:{other:arr};}
  return arr.length>1?{ambig:arr}:{item:arr[0]};
}
function scMatch(p,text){
  var t=String(text||'').replace(/\u001d/g,' ').trim(),g=parseGS1(text),canon=scCanon(text),ix=scIndex(p);
  var byCode={};
  function look(k){
    var r=scPickItem(p,k,ix);if(!r)return null;
    return r.item?{item:r.item,gs1:g,canon:canon}:{item:null,gs1:g,canon:canon,ambig:r.ambig,other:r.other};
  }
  var learned=db.barcodes&&db.barcodes[canon],r0;
  if(learned&&(r0=look(String(learned).trim().toLowerCase())))return Object.assign(r0,{how:'learned'});
  var low=t.toLowerCase();
  if(r0=look(low))return Object.assign(r0,{how:'code'});
  if(!g){
    var toks=low.split(/[^a-z0-9]+/).filter(Boolean);
    for(var k=0;k<toks.length;k++)if(r0=look(toks[k]))return Object.assign(r0,{how:'code'});
    /* mã nằm lẫn trong chuỗi, ví dụ VT10000002, CCDC-00123-LVL, {"ma":"10000025"} */
    var best=null,bl=0;
    Object.keys(ix).forEach(function(c){
      if(c.length>=5&&c.length>bl&&scHasCode(low,c)){best=c;bl=c.length;}
    });
    if(best&&(r0=look(best)))return Object.assign(r0,{how:'code'});
  }
  return {item:null,gs1:g,canon:canon};
}
function scEnsureZx(){
  return new Promise(function(res){
    if(window.ZXing){res(true);return;}
    var sc=document.createElement('script');sc.src=ZX_URL;
    sc.onload=function(){res(!!window.ZXing);};sc.onerror=function(){res(false);};
    document.head.appendChild(sc);
  });
}
function scInitDecoder(){
  if('BarcodeDetector' in window){try{SC.det=new BarcodeDetector();return Promise.resolve(true);}catch(e){SC.det=null;}}
  return scEnsureZx();
}
function scDecodeZx(c){
  if(!window.ZXing)return null;
  try{
    if(!SC.zr){var hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);SC.zr=new ZXing.MultiFormatReader();SC.zr.setHints(hints);}
    var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
    return SC.zr.decode(bmp).getText();
  }catch(e){return null;}
}
function scDecode(c){
  if(SC.det){
    return SC.det.detect(c).then(function(r){return (r&&r.length)?r[0].rawValue:null;}).catch(function(){
      SC.det=null;return scEnsureZx().then(function(){return scDecodeZx(c);});
    });
  }
  return Promise.resolve(scDecodeZx(c));
}
function scInApp(){

function scLoadImage(f){

/* ================= Đọc số viết tay (OCR) để khớp vật tư ================= */
var OCR_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var OCR_LANG='https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int';
var OCR={worker:null,loading:null,psm:7,pool:[],q:[]};
function ocrLoadScript(){
  return new Promise(function(res){
    if(window.Tesseract){res(true);return;}
    var s=document.createElement('script');s.src=OCR_URL;
    s.onload=function(){res(!!window.Tesseract);};s.onerror=function(){res(false);};
    document.head.appendChild(s);
  });
}
function ocrCreate(){
  return ocrLoadScript().then(function(ok){
    if(!ok)throw new Error('script');
    return Tesseract.createWorker('eng',1,{langPath:OCR_LANG,logger:function(m){
      if(!m||!SC)return;
      var pct=Math.round((m.progress||0)*100);
      if(/load|init/i.test(m.status||'')){
        scOcrStatus('Số: đang tải '+pct+'%');
        if(SC.ocrBusy)scMsg('Đang tải bộ đọc số… '+pct+'% (chỉ lần đầu)');
      }else if(m.status==='recognizing text'&&SC.ocrBusy)scMsg('Đang đọc số… '+pct+'%');
    }});
  }).then(function(w){
    return w.setParameters({tessedit_char_whitelist:'0123456789.,-',preserve_interword_spaces:'1',user_defined_dpi:'300',tessedit_pageseg_mode:'7'}).then(function(){return w;});
  });
}
function ocrWorker(){
  if(OCR.worker)return Promise.resolve(OCR.worker);
  if(OCR.loading)return OCR.loading;
  OCR.loading=ocrCreate().then(function(w){
    OCR.worker=w;OCR.pool.push({w:w,busy:false,psm:7});OCR.err='';
    scOcrStatus('Số: sẵn sàng ✓','#4ade80');
    /* máy nhiều nhân: nạp thêm bộ đọc thứ 2 để đọc 2 dòng cùng lúc */
    if((navigator.hardwareConcurrency||2)>=4)setTimeout(function(){
      ocrCreate().then(function(w2){OCR.pool.push({w:w2,busy:false,psm:7});ocrPump();}).catch(function(){});
    },300);
    return w;
  }).catch(function(e){OCR.loading=null;throw e;});
  return OCR.loading;

function ocrParse(r){
  var out=[],cf=(r.data&&typeof r.data.confidence==='number')?r.data.confidence:0;
  String((r.data&&r.data.text)||'').split(/\n+/).forEach(function(t){
    var dg=t.replace(/\D/g,'');
    if(dg.length>=3)out.push({raw:t.trim(),digits:dg,conf:cf});
    var toks=t.split(/\s+/).map(function(x){return x.replace(/\D/g,'');}).filter(function(x){return x.length>=3;});
    if(toks.length>1)toks.forEach(function(x){if(!out.some(function(o){return o.digits===x;}))out.push({raw:x,digits:x,conf:cf});});
  });
  return out;
}
function ocrPump(){
  OCR.pool.forEach(function(en){
    if(en.busy||!OCR.q.length)return;
    var j=OCR.q.shift();en.busy=true;
    var go=function(){return en.w.recognize(j.cv,{},{text:true,blocks:false,hocr:false,tsv:false});};
    (en.psm===j.psm?go():en.w.setParameters({tessedit_pageseg_mode:String(j.psm)}).then(function(){en.psm=j.psm;return go();}))
      .then(function(r){en.busy=false;j.res(ocrParse(r));ocrPump();})
      .catch(function(e){en.busy=false;j.rej(e);ocrPump();});
  });

function ocrRun(cv,psm){
  return ocrWorker().then(function(){
    return new Promise(function(res,rej){OCR.q.push({cv:cv,psm:psm,res:res,rej:rej});ocrPump();});
  });

/* Xoá các đường kẻ dài (viền bảng/khung nhãn) để không dính vào chữ số */
function ocrStripLines(out,w,h){
  var x,y,run,st,mx=Math.round(w*0.25),my=Math.round(h*0.2);
  for(y=0;y<h;y++){
    run=0;
    for(x=0;x<=w;x++){
      if(x<w&&out[y*w+x]===0)run++;
      else{if(run>mx)for(st=x-run;st<x;st++)out[y*w+st]=255;run=0;}
    }
  }
  for(x=0;x<w;x++){
    run=0;
    for(y=0;y<=h;y++){
      if(y<h&&out[y*w+x]===0)run++;
      else{if(run>my)for(st=y-run;st<y;st++)out[st*w+x]=255;run=0;}
    }
  }

/* Giữ lại đúng các "dòng ký tự": chỉ những mảnh liền nhau có kích thước giống chữ/số và xếp thẳng hàng.
   Viền ô, đường kẻ, vân gỗ/màn hình, đốm nhiễu đều bị loại trước khi đưa vào nhận dạng (nguyên nhân số bị thừa "1" ở đầu/cuối). */

      });
    }else scMsg(lines.length?'Chưa đọc rõ — giữ yên máy, đủ sáng, để tem nằm gọn trong khung':scHint());
  }).catch(function(e){if(SC){SC.autoBusy=false;SC.ocrAt=Date.now()+4000;scOcrStatus('Số: lỗi đọc · '+((e&&e.message)||'?'),'#f87171');}});

var RISK={key:'',set:null};
function scRisky(p,it){
  var key=p.id+':'+p.items.length;
  if(RISK.key!==key){
    var pat=Object.create(null),set={};
    p.items.forEach(function(i){
      var cd=ocrDigits(i.code);if(cd.length<4)return;
      for(var k=0;k<cd.length;k++){
        var pt=cd.slice(0,k)+'*'+cd.slice(k+1),o=pat[pt];
        if(!o)pat[pt]={cd:cd,id:i.id};
        else if(o.cd!==cd){set[o.id]=1;set[i.id]=1;}
      }
    });
    RISK={key:key,set:set};
  }
  return !!RISK.set[it.id];
}
function ocrQtyCands(lines,codeLine){
  var out=[];
  (lines||[]).forEach(function(L){
    if(L.digits===codeLine||L.digits.length>=7)return;
    var m=String(L.raw||'').replace(/[^\d.,]/g,'');
    if(!/\d/.test(m))return;
    var n=parseNum(m);
    if(n>0&&out.indexOf(n)<0)out.push(n);
  });
  return out.slice(0,2);
}

function scOcrProcess(src,crop){
  if(!SC)return;
  var p=per(SC.pid);if(!p)return;
  SC.hold=true;SC.ocrBusy=true;SC.pending=null;
  document.getElementById('scres').innerHTML='';
  var variants=[['bin',6,0],['gray',6,0],['bin2',11,0]],all=[],idx=0,rotAdded=false;
  scMsg('Đang chuẩn bị bộ đọc số…');
  function finish(r){
    if(!SC)return;
    SC.ocrBusy=false;
    r=r||ocrRank(p,all);
    if(r.length&&r[0].dist===0&&(r.length<2||r[1].dist>0)){
      scMsg('Đã đọc số: '+r[0].line);
      scShowMatched({item:r[0].item,how:'ocr',qty:ocrQtyCands(all,r[0].line)});
    }else{
      scMsg(all.length?'Đã đọc được số, hãy kiểm tra lại bên dưới.':'Không thấy chữ số nào trong khung.');
      var rl=all.filter(function(L){return (L.conf||0)>=OCR_CONF;});
      SC.lastLines=rl.length?rl:all;
      scShowOcr(SC.lastLines,r);
    }
  }
  function next(){
    if(!SC)return;
    if(idx>=variants.length){
      if(!rotAdded&&!all.some(function(L){return L.digits.length>=6&&(L.conf||0)>=OCR_CONF;})){rotAdded=true;variants.push(['bin',6,180],['bin',6,90],['bin',6,270]);}
      else return finish();
    }
    var v=variants[idx++];
    scMsg('Đang đọc số… (lần '+idx+'/'+variants.length+')');
    ocrFrame(src,crop,v[0],1400,5,true,function(lines){var r=ocrRank(p,lines);return r.length&&r[0].dist===0;},v[2]||0).then(function(lines){
      if(!SC)return;
      lines.forEach(function(L){if(!all.some(function(a){return a.digits===L.digits;}))all.push(L);});
      var r=ocrRank(p,all);
      if(r.length&&r[0].dist===0)return finish(r);
      next();
    }).catch(fail);
  }
  function fail(e){
    if(!SC)return;
    SC.ocrBusy=false;SC.hold=false;
    scMsg('Không chạy được bộ đọc số (lần đầu cần có mạng để tải). Hãy nhập dãy số bên dưới.');
  }
  next();
}

var SKEY=new WeakMap();
function skey(it){var k=SKEY.get(it);if(!k||k.n!==it.name||k.c!==it.code){k={n:it.name,c:it.code,s:norm(it.name)+"\u0001"+norm(it.code)};SKEY.set(it,k);}return k.s;}
function skeyWarm(p){
  var i=0,its=p.items,step=function(){var e=Math.min(its.length,i+1500);for(;i<e;i++)skey(its[i]);if(i<its.length)(window.requestIdleCallback||setTimeout)(step);};
  (window.requestIdleCallback||setTimeout)(step);
}
function baseList(p){
  var nq=norm(P.q);
  return p.items.filter(function(i){
    if(P.br!=="all"&&i.branch!==P.br)return false;
    if(nq&&skey(i).indexOf(nq)<0)return false;
    return true;
  });
}
function filteredList(p){
  return baseList(p).filter(function(i){
    if(P.flt==="todo")return needsCount(i);
    if(P.flt==="done")return i.counted;
    if(P.flt==="diff")return i.counted&&diffOf(i)!==0;
    if(P.flt==="stock")return i.close>0;
    return true;
  });
}

function renderChips(p,base){
  var branches=[];
  p.items.forEach(function(i){if(i.branch&&branches.indexOf(i.branch)<0)branches.push(i.branch);});
  var cnt=function(k){
    return base.filter(function(i){
      if(k==="todo")return needsCount(i);
      if(k==="done")return i.counted;
      if(k==="stock")return i.close>0;
      return i.counted&&diffOf(i)!==0;
    }).length;
  };
  var h="";
  if(branches.length>1){
    h+='<select class="chip" onchange="A.setBr(this.value)"><option value="all"'+(P.br==="all"?" selected":"")+'>Tất cả kho</option>';
    branches.forEach(function(b){h+='<option value="'+esc(b)+'"'+(P.br===b?" selected":"")+'>'+esc(b)+'</option>';});
    h+='</select>';
  }
  [["all","Tất cả "+base.length],["todo","Chưa kiểm "+cnt("todo")],["stock","Còn tồn "+cnt("stock")],["diff","Chênh lệch "+cnt("diff")],["done","Đã kiểm "+cnt("done")]].forEach(function(c){
    h+='<button class="chip'+(P.flt===c[0]?" chip-on":"")+'" onclick="A.setFlt(\''+c[0]+'\')">'+c[1]+'</button>';
  });
  document.getElementById("chips").innerHTML=h;
}
function renderList(){
  var p=per(P.id);if(!p)return;
  var base=baseList(p);
  var list=base.filter(function(i){
    if(P.flt==="todo")return needsCount(i);
    if(P.flt==="done")return i.counted;
    if(P.flt==="diff")return i.counted&&diffOf(i)!==0;
    if(P.flt==="stock")return i.close>0;
    return true;
  });
  var ist=invStats(p),total=ist.tot,done=ist.done,ndiff=ist.diff,pct=ist.pct;
  var flist=list;
  var fTodo=flist.filter(function(i){return needsCount(i);}).length;
  var allDone=flist.length>0&&fTodo===0;
  document.getElementById("pfill").style.width=pct+"%";
  document.getElementById("pdone").innerHTML='Đã kiểm <b class="tnum" style="color:var(--ink)">'+done+"/"+total+"</b> · "+pct+"%";
  document.getElementById("pdiff").innerHTML=ndiff>0?'<b style="color:var(--red)">'+ndiff+" mã chênh lệch</b>":"Chưa có chênh lệch";
  v2Ring(p);
  var exl=document.getElementById("exlink");

    if(ndiff>0){exl.style.display="flex";exl.innerHTML=icon('edit',16)+'Làm phiếu giải trình ('+ndiff+' mã chênh lệch)'+icon('chev',16);}
    else exl.style.display="none";
  }
  document.getElementById("seqbtn").textContent=allDone?"✓ Hoàn tất — Xuất báo cáo Excel":"▶ Kiểm tuần tự · còn "+fTodo+" mã";
  renderChips(p,base);

  var branchesMulti=false;
  var seen={};
  for(var i=0;i<p.items.length;i++){seen[p.items[i].branch]=1;}
  branchesMulti=Object.keys(seen).length>1;

  var h="";
  if(!list.length)h='<div class="empty">Không có vật tư nào khớp bộ lọc.</div>';
  list.slice(0,P.limit).forEach(function(it){
    var d=diffOf(it);

    (it.batches||[]).forEach(function(b){var x=daysTo(b.exp);if(x!==null&&(worst===null||x<worst))worst=x;});
    var badges="";
    if(!it.counted)badges+='<span class="bdg">Chưa kiểm</span>';
    else if(d===0)badges+='<span class="bdg bdg-ok" style="display:inline-flex;align-items:center;gap:3px">'+icon('check',11)+'Khớp</span>';

    else badges+='<span class="bdg bdg-minus">−'+fmt(Math.abs(d))+' Thiếu</span>';
    if(worst!==null&&worst<=90){
      badges+='<span class="bdg '+(worst<0?"bdg-minus":worst<=30?"bdg-org":"bdg-plus")+'">HSD '+(worst<0?"quá hạn":"còn "+worst+"d")+'</span>';
    }
    if(it.photo)badges+='<span class="bdg" style="font-size:10px;display:inline-flex;align-items:center;gap:3px">'+icon('camera',11)+'Có ảnh</span>';
    var st=!it.counted?'<span class="pl">Chưa kiểm</span>':d===0?'<span class="pl pl-ok">Khớp</span>':d>0?'<span class="pl pl-plus">Thừa '+fmt(d)+'</span>':'<span class="pl pl-minus">Thiếu '+fmt(Math.abs(d))+'</span>';
    var hs=(worst!==null&&worst<=90)?'<span class="hs'+(worst<0?' r':'')+'">HSD '+(worst<0?'quá hạn':'còn '+worst+' ngày')+'</span>':'';
    h+='<div class="item v2i" onclick="A.openItem(\''+it.id+'\',false)"><div class="thumb">'+(it.photo?'<img src="'+it.photo+'" alt="">':icon('box',26))+'</div>'
      +'<div class="im"><div class="ihd"><b>'+esc(it.code||it.name)+'</b>'+st+'</div><div class="inm">'+esc(it.name)+'</div>'
      +'<div class="ift"><span>ĐVT: '+esc(it.unit)+(branchesMulti?' · '+esc(it.branch):'')+'</span><span>Tồn: '+fmt(it.close)+' <i>|</i> Thực tế: '+(it.counted?fmt(it.countQty):'-')+'</span></div>'+hs+'</div>'
      +'<span class="ich">'+icon('chev',18)+'</span></div>';
  });
  if(list.length>P.limit){

  }

}

function compressImg(file,maxPx,quality,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(1,maxPx/img.width,maxPx/img.height);
      var w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyItem(item){
  var p=per(P.id);if(!p)return;
  for(var i=0;i<p.items.length;i++)if(p.items[i].id===item.id){
    var o=p.items[i];
    if(o.counted!==item.counted||o.countQty!==item.countQty)audit('Số lượng kiểm kê',p.name+' · '+item.code,o.counted?o.countQty:null,item.counted?item.countQty:null);
    p.items[i]=item;break;
  }
  var key=normKey(item.branch,item.code,item.name);
  var dated=(item.batches||[]).filter(function(b){return b.exp;});
  if(dated.length)db.hsd[key]={branch:item.branch,code:item.code,name:item.name,unit:item.unit,batches:dated,updatedAt:Date.now()};

}

function tsLabel(ts){
  var d=new Date(ts),p=function(n){return String(n).padStart(2,'0');};
  return p(d.getHours())+':'+p(d.getMinutes())+' ngày '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function mergeDb(d){
  var st={p:0,h:0,e:0,a:0,u:0,c:0};
  function add(dst,src,k){
    (src||[]).forEach(function(x){
      if(x&&x.id&&!dst.some(function(y){return y.id===x.id;})){dst.push(x);st[k]++;}
    });
    dst.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }
  add(db.periods,d.periods,'p');add(db.handovers,d.handovers,'h');add(db.explains,d.explains,'e');
  if(!db.assets)db.assets=[];
  (d.assets||[]).forEach(function(x){
    if(!x||!x.id||!Array.isArray(x.items))return;
    var y=null;db.assets.forEach(function(z){if(z.id===x.id)y=z;});
    if(!y){db.assets.push(x);st.a++;return;}
    x.items.forEach(function(it){if(!y.items.some(function(q){return q.id===it.id;}))y.items.push(it);});
  });
  (d.folders||[]).forEach(function(f){if(f&&db.folders.indexOf(f)<0)db.folders.push(f);});
  Object.keys(d.barcodes||{}).forEach(function(k){if(!db.barcodes[k])db.barcodes[k]=d.barcodes[k];});
  if(!db.ocrfix)db.ocrfix={};
  Object.keys(d.ocrfix||{}).forEach(function(k){if(!db.ocrfix[k])db.ocrfix[k]=d.ocrfix[k];});
  migrateFolders();
  Object.keys(d.hsd||{}).forEach(function(k){if(!db.hsd[k])db.hsd[k]=d.hsd[k];});
  Object.keys(d.counters||{}).forEach(function(k){db.counters[k]=Math.max(db.counters[k]||0,d.counters[k]||0);});
  if(d.profile&&d.profile.ten&&!(db.profile&&db.profile.ten))db.profile=d.profile;
  if(!db.signers)db.signers={};
  Object.keys(d.signers||{}).forEach(function(k){if(!db.signers[k])db.signers[k]=d.signers[k];});
  /* kỳ đã có trên máy: lấy bản đã khoá, hoặc mục đã kiểm mà máy này chưa kiểm */
  [['periods','periods'],['assets','assets']].forEach(function(pr){
    (d[pr[0]]||[]).forEach(function(x){
      if(!x||!x.id||!Array.isArray(x.items))return;
      var y=null;(db[pr[1]]||[]).forEach(function(z){if(z.id===x.id)y=z;});
      if(!y||y===x)return;
      if(x.locked&&!y.locked){Object.keys(y).forEach(function(k){delete y[k];});Object.assign(y,x);st.u++;return;}
      if(y.locked)return;
      x.items.forEach(function(it){
        var q=null;y.items.forEach(function(z){if(z.id===it.id)q=z;});
        if(q&&it.counted&&!q.counted){Object.keys(q).forEach(function(k){delete q[k];});Object.assign(q,it);st.u++;}
        else if(q&&it.counted&&q.counted&&it.countQty!==q.countQty)st.c++;
      });
    });
  });
  return st;
}

function sgOf(branch){
  var out={giamDoc:'',thuKho:'',hanhChinh:''},all=db.signers||{};
  var b=String(branch||'').trim()||(db.profile&&db.profile.chiNhanh)||'',n=norm(b),key=null;
  if(b&&all[b])key=b;
  else if(n)Object.keys(all).forEach(function(k){var nk=norm(k);if(!key&&nk&&(n.indexOf(nk)>=0||nk.indexOf(n)>=0))key=k;});
  if(key)SG_ROLES.forEach(function(r){out[r.k]=String(all[key][r.k]||'').trim();});
  if(!out.thuKho)out.thuKho=defaultNguoi(b);
  return out;
}
function sgBranches(){
  var seen={},out=[],add=function(x){x=String(x||'').trim();if(x&&!seen[x]){seen[x]=1;out.push(x);}};
  (db.folders||[]).forEach(add);
  var pc=String((db.profile&&db.profile.chiNhanh)||'').trim(),npc=norm(pc);
  if(pc&&!out.some(function(x){var nx=norm(x);return nx.indexOf(npc)>=0||npc.indexOf(nx)>=0;}))add(pc);
  Object.keys(db.signers||{}).forEach(add);
  return out;
}

/* ================= Ảnh kiểm kê TS & CCDC: chụp nét + tự lưu ảnh tem khi quét không khớp (IndexedDB) ================= */
var PH={db:null,cache:{},mem:{},busy:{},
  open:function(){
    if(PH._o)return PH._o;
    PH._o=new Promise(function(res){
      try{
        var rq=indexedDB.open('kk_photos',1);
        rq.onupgradeneeded=function(){rq.result.createObjectStore('p');};
        rq.onsuccess=function(){PH.db=rq.result;res(PH.db);};
        rq.onerror=function(){res(null);};
      }catch(e){res(null);}
    });
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    return PH._o;
  },
  put:function(id,d){
    PH.cache[id]=d;
    return PH.open().then(function(db){
      if(!db){PH.mem[id]=d;if(!PH.warned){PH.warned=1;toast('Trình duyệt không lưu ảnh lâu dài được — hãy xuất Excel sớm');}return;}
      return new Promise(function(res){

/* Độ nét = phương sai Laplacian; ảnh càng nét càng lớn */
function phSharp(cv){
  var k=Math.min(1,320/Math.max(cv.width,cv.height)),w=Math.max(8,Math.round(cv.width*k)),h=Math.max(8,Math.round(cv.height*k));
  var c=PH._sc||(PH._sc=document.createElement('canvas'));c.width=w;c.height=h;
  var g=c.getContext('2d',{willReadFrequently:true});g.drawImage(cv,0,0,w,h);
  var d=g.getImageData(0,0,w,h).data,L=new Float32Array(w*h),i,x,y,s=0,s2=0,n=0,v;
  for(i=0;i<w*h;i++)L[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){i=y*w+x;v=4*L[i]-L[i-1]-L[i+1]-L[i-w]-L[i+w];s+=v;s2+=v*v;n++;}
  return s2/n-(s/n)*(s/n);
}
function phSharpen(cv,a){
  try{
    var g=cv.getContext('2d'),w=cv.width,h=cv.height,im=g.getImageData(0,0,w,h),s=im.data,o=new Uint8ClampedArray(s),x,y,i,c,v;
    for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){i=(y*w+x)*4;for(c=0;c<3;c++){v=s[i+c];o[i+c]=v+a*(4*v-s[i+c-4]-s[i+c+4]-s[i+c-w*4]-s[i+c+w*4]);}}
    im.data.set(o);g.putImageData(im,0,0);
  }catch(e){}
}
function phFrame(v,maxSide){
  if(!v||!v.videoWidth)return null;
  var k=Math.min(1,maxSide/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
  try{c.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);}catch(e){return null;}
  return c;
}
/* Chụp liên tiếp n khung, giữ khung nét nhất */
function phBurst(v,n,gap,maxSide){
  return new Promise(function(res){
    var best=null,bs=-1,i=0;
    (function step(){
      var c=phFrame(v,maxSide);
      if(c){var s=phSharp(c);if(s>bs){bs=s;best=c;}}
      if(++i<n)setTimeout(step,gap);else res({cv:best,score:bs});
    })();
  });
}
/* Ảnh tĩnh độ phân giải đầy đủ (có tự lấy nét) nếu trình duyệt hỗ trợ ImageCapture */
function phStill(track){
  if(!track||typeof ImageCapture==='undefined')return Promise.resolve(null);
  return new Promise(function(res){
    var done=false,fin=function(x){if(!done){done=true;res(x);}};
    setTimeout(function(){fin(null);},5000);
    try{
      new ImageCapture(track).takePhoto().then(scLoadImage).then(function(im){
        var c=document.createElement('canvas');c.width=im.w;c.height=im.h;c.getContext('2d').drawImage(im.el,0,0);fin(c);
      }).catch(function(){fin(null);});
    }catch(e){fin(null);}
  });
}
function phShoot(v,track,maxSide){
  var out=function(cv,sharp){
    var k=Math.min(1,maxSide/Math.max(cv.width,cv.height));
    if(k<1){var c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);var g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,c.width,c.height);cv=c;}
    if(sharp)phSharpen(cv,.5);
    return {d:cv.toDataURL('image/jpeg',.92),w:cv.width,h:cv.height};
  };
  return phStill(track).then(function(cv){
    if(cv)return out(cv,false);
    return phBurst(v,5,110,2560).then(function(r){return r.cv?out(r.cv,true):null;});
  });
}

    qty:col(function(x){return /so luong/.test(x)&&!/kiem ke/.test(x);}),
    unit1:col(function(x){return /don vi cap/.test(x);}),
    cQty:col(function(x){return /so luong/.test(x)&&/kiem ke/.test(x);}),
    mgmt:col(function(x){return /don vi quan ly/.test(x);}),
    room:col(function(x){return /^phong/.test(x);}),
    user:col(function(x){return /nguoi su dung/.test(x);}),
    loc:col(function(x){return /^vi tri/.test(x);}),
    quality:col(function(x){return /pham chat/.test(x);}),
    status:col(function(x){return /tinh trang/.test(x);}),
    note:col(function(x){return /ghi chu/.test(x);})
  };
  var g=function(r,k){return C[k]>=0&&r[C[k]]!=null?String(r[C[k]]).trim():'';};
  var info={branch:'',dateCount:'',cutoff:''};
  for(i=0;i<hr;i++){
    rows[i].forEach(function(c){
      var s=String(c||'').trim(),n=norm(s);
      if(/^chi nhanh/.test(n)&&!info.branch)info.branch=s.replace(/^chi\s*nh[^\s]*\s*/i,'').trim();
      if(/kiem ke/.test(n)&&/thoi\s*diem/.test(n)&&!/chot/.test(n))info.dateCount=asIso(s);
      if(/chot/.test(n))info.cutoff=asIso(s);
    });
  }
  var items=[],n=0;
  for(i=hr+1;i<rows.length;i++){
    var r=rows[i],code=g(r,'code'),name=g(r,'name');
    if(!code&&!name)continue;
    if(/^tong/.test(norm(name))||/^tong/.test(norm(g(r,'stt'))))continue;
    n++;
    var qs=g(r,'qty'),cs=g(r,'cQty'),it={
      id:'a'+n+'_'+asRid(),stt:g(r,'stt')||String(n),code:code,name:name||code,unit:g(r,'unit'),
      qty:qs===''?1:(parseNum(qs)||0),unit1:g(r,'unit1'),counted:false,cQty:null,
      mgmt:g(r,'mgmt'),room:g(r,'room'),user:g(r,'user'),loc:g(r,'loc'),quality:g(r,'quality'),status:g(r,'status'),note:g(r,'note')
    };
    if(cs!==''){it.counted=true;it.cQty=parseNum(cs)||0;it.at=Date.now();it.by='(nhập từ file)';}
    items.push(it);
  }
  return {items:items,info:info};
}

/* ---- Ghi kết quả kiểm kê ---- */
function asApply(p,it,v){
  var was=it.counted,oq=it.cQty;
  asLog(p,v.status==='Không tìm thấy'?'Ghi nhận không tìm thấy':(was?'Ghi đè kiểm kê':'Kiểm kê'),it,(was?'SL '+fmt(oq)+' → ':'SL ')+fmt(v.cQty)+(v.room?' · '+v.room:''));
  it.counted=true;it.cQty=v.cQty;
  it.mgmt=v.mgmt||it.unit1||'';it.room=v.room||'';it.user=v.user||'';
  it.loc=v.loc||asLocOf(v.room);
  it.quality=v.quality||'Tốt';it.status=v.status||'Đang sử dụng';
  if(v.note!==undefined)it.note=v.note;
  it.at=Date.now();it.by=(db.profile&&db.profile.ten)||'';
  p.cur=p.cur||{};
  if(v.room)p.cur.room=v.room;
  if(v.user)p.cur.user=v.user;
  p.cur.loc=it.loc||p.cur.loc||'';
  saveSoon();
}
function asDefaults(p,it){
  var c=p.cur||{};
  if(it.counted)return {cQty:it.cQty,mgmt:it.mgmt,room:it.room,user:it.user,loc:it.loc,quality:it.quality||'Tốt',status:it.status||'Đang sử dụng'};
  return {cQty:it.qty>0?it.qty:1,mgmt:it.unit1,room:c.room||'',user:c.user||'Sử dụng chung',loc:c.loc||asLocOf(c.room),quality:'Tốt',status:'Đang sử dụng'};
}

function asSummary(p){
  var s={tot:0,done:0,ok:0,less:0,more:0,miss:0,todo:0,extra:0,trace:0,bad:0},fl={};
  p.items.forEach(function(i){
    var f=asLocOf(i.room)||i.loc||'Chưa rõ vị trí',g=fl[f]||(fl[f]={tot:0,done:0,less:0,more:0,miss:0,ext:0});
    if(i.extra){s.extra++;g.ext++;if(i.trace)s.trace++;return;}
    s.tot++;g.tot++;
    if(!i.counted){s.todo++;return;}
    s.done++;g.done++;
    if(i.status==='Không tìm thấy'){s.miss++;g.miss++;return;}
    var d=asDiff(i);
    if(d===0)s.ok++;else if(d<0){s.less++;g.less++;}else{s.more++;g.more++;}
    if(i.quality!=='Tốt'||i.status!=='Đang sử dụng')s.bad++;
  });
  s.pct=s.tot?Math.round(s.done/s.tot*100):0;
  s.floors=Object.keys(fl).sort(function(a,b){return a.localeCompare(b,'vi',{numeric:true});}).map(function(k){return [k,fl[k]];});
  return s;
}

    +'<div class="bar" style="margin-top:12px"><div class="fill" style="width:'+s.pct+'%"></div></div>'
    +'<div style="font-size:12px;color:var(--mut);margin:4px 0 10px">Đã kiểm '+s.done+'/'+s.tot+' tài sản theo sổ · '+s.pct+'% · chạm từng ô để xem danh sách</div>'

function asSheetHead(ws,heads,widths){

    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E2F3'}};c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  });

}
function addSummarySheet(wb,p){
  var s=asSummary(p),ws=wb.addWorksheet('TỔNG KẾT'),F={name:'Times New Roman',size:11},bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  ws.getColumn(1).width=38;for(var i=2;i<=7;i++)ws.getColumn(i).width=14;
  var put=function(r,c,v,o){var x=ws.getCell(r,c);x.value=v;x.font=Object.assign({},F,o||{});x.border=bd;x.alignment={vertical:'middle',horizontal:c===1?'left':'center'};return x;};
  ws.mergeCells('A1:G1');var t=ws.getCell('A1');t.value='TỔNG KẾT KIỂM KÊ — '+p.name;t.font=Object.assign({},F,{bold:true,size:13});
  var rows=[['Tổng số tài sản theo sổ sách',s.tot],['Đã kiểm kê',s.done+' ('+s.pct+'%)'],['Khớp số lượng',s.ok],['Thiếu (kiểm kê < sổ sách)',s.less],['Thừa (kiểm kê > sổ sách)',s.more],['Không tìm thấy',s.miss],['Chưa kiểm',s.todo],['Hỏng / không sử dụng',s.bad],['Phát hiện thêm ngoài sổ',s.extra],['Trong đó cần dò tìm (chưa rõ tên)',s.trace]];
  rows.forEach(function(x,k){put(3+k,1,x[0]);put(3+k,2,x[1],{bold:true});});
  var r=3+rows.length+1;
  ['Vị trí','Tổng','Đã kiểm','Thiếu','Thừa','Không thấy','Phát hiện thêm'].forEach(function(h,j){var x=put(r,j+1,h,{bold:true});x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E2F3'}};});
  s.floors.forEach(function(f,k){var g=f[1];[f[0],g.tot,g.done,g.less,g.more,g.miss,g.ext].forEach(function(v,j){put(r+1+k,j+1,v);});});
}

/* ================= Số quét chưa khớp: tự ghi nhận để đối chiếu sau ================= */
function eanOk(d){
  if(!/^\d+$/.test(d)||[8,12,13,14].indexOf(d.length)<0)return null;
  var sum=0,n=d.length,i;
  for(i=0;i<n-1;i++)sum+=(+d.charAt(i))*(((n-2-i)%2===0)?3:1);
  return ((10-sum%10)%10)===(+d.charAt(n-1));
}
function unmList(p){if(!p.unm)p.unm=[];return p.unm;}
function unmOpenCount(p){return (p&&p.unm?p.unm:[]).filter(function(e){return e.st==='open';}).length;}
function unmKeyOf(text){var t=String(text||'').trim();return /^[\d\s.,-]+$/.test(t)?ocrDigits(t):t.toLowerCase();}
function unmAdd(p,text,kind,n){
  var key=unmKeyOf(text),L=unmList(p),now=Date.now(),e=null;
  L.forEach(function(x){if(!e&&x.key===key)e=x;});
  if(e){e.n+=(n||1);e.last=now;saveSoon();return {e:e,isNew:false};}
  e={id:'u'+now.toString(36)+Math.random().toString(36).slice(2,5),key:key,text:String(text).trim(),kind:kind,n:n||1,first:now,last:now,st:'open',by:(db.profile&&db.profile.ten)||''};
  L.push(e);saveSoon();return {e:e,isNew:true};
}

}

function scTrack(lines){
  var now=Date.now(),T=(SC.trk||[]).filter(function(c){return now-c.t<6000;});
  lines.forEach(function(L){
    var d=L.digits;if(d.length<6||d.length>20)return;
    var c=null;
    T.forEach(function(x){if(!c&&(x.rep===d||(x.rep.length===d.length&&ocrLev(x.rep,d,1)<=1)))c=x;});
    if(!c){c={rep:d,cnt:{},n:0,t:now,done:false};T.push(c);}
    c.cnt[d]=(c.cnt[d]||0)+1;c.n++;c.t=now;
    var best=d;Object.keys(c.cnt).forEach(function(k){if(c.cnt[k]>c.cnt[best])best=k;});c.rep=best;
  });
  SC.trk=T;return T;
}

  scPhoto:function(input){
    var f=input.files&&input.files[0];input.value='';

    scMsg('Đang đọc ảnh…');
    var info=(f.type||'không rõ định dạng')+', '+Math.round(f.size/1024)+' KB';
    scLoadImage(f).then(function(im){
      if(!SC)return;
      try{var kk=Math.min(1,1600/Math.max(im.w,im.h)),sn=document.createElement('canvas');sn.width=Math.round(im.w*kk);sn.height=Math.round(im.h*kk);sn.getContext('2d').drawImage(im.el,0,0,sn.width,sn.height);SC.snap={d:sn.toDataURL('image/jpeg',0.88),w:sn.width,h:sn.height};}catch(e){}
      var go=function(){
        var tryScale=function(maxSide){
          var k=Math.min(1,maxSide/Math.max(im.w,im.h));
          var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.w*k));c.height=Math.max(1,Math.round(im.h*k));
          c.getContext('2d').drawImage(im.el,0,0,c.width,c.height);
          return scDecode(c);
        };
        tryScale(1600).then(function(t){return t||tryScale(900);}).then(function(t){return t||tryScale(2400);}).then(function(txt){
          if(!SC)return;
          if(txt){scMsg('Đã đọc ảnh');scOnCode(txt,true);}
          else scOcrProcess(im.el,{x:0,y:0,w:im.w,h:im.h});
        });
      };
      if(!SC.det&&!window.ZXing)scEnsureZx().then(go);else go();
    }).catch(function(){scMsg('Không mở được ảnh ('+info+'). Thử chụp lại hoặc nhập số.');});

    else if(k==="match"){s=String(Math.round(SB._close*100)/100);}
    else if(k==="+1"||k==="-1"){
      var base=s===""?SB._close:parseNum(s);
      var nv=base+(k==="+1"?1:-1);
      if(nv<0)nv=0;
      s=String(Math.round(nv*100)/100);
    }else if(k==="."){
      if(s.indexOf(".")<0)s=(s===""?"0":s)+".";
    }else{
      if(s==="0")s=k;
      else if(s.length<12){
        var dot=s.indexOf(".");
        if(!(dot>=0&&s.length-dot-1>=2))s=s+k;
      }
    }
    SB.qtyStr=s;
    A.calc();

    var hint=document.getElementById("snotehint");
    var qn=qv===""?null:parseNum(qv);
    var diff=qn===null?null:Math.round((qn-SB._close)*100)/100;
    if(diff===null){ban.innerHTML="";}
    else if(diff===0){ban.innerHTML='<div class="ban ban-ok">✓ Khớp tồn kho sổ sách</div>';}
    else if(diff>0){ban.innerHTML='<div class="ban ban-plus">▲ THỪA '+fmt(diff)+" "+esc(SB._unit||"")+' so với sổ sách</div>';}
    else{ban.innerHTML='<div class="ban ban-minus">▼ THIẾU '+fmt(Math.abs(diff))+" "+esc(SB._unit||"")+' so với sổ sách</div>';}
    var needNote=diff!==null&&diff!==0&&!note;
    lbl.textContent="Ghi chú / giải trình"+(diff!==null&&diff!==0?" (bắt buộc)":"");
    lbl.style.color=needNote?"#f87171":"";
    hint.innerHTML=needNote?'<div class="hint-red">Có chênh lệch — bắt buộc nhập nguyên nhân trước khi lưu.</div>':"";

    var batches=SB.batches.filter(function(b){return b.exp;}).map(function(b){
      return {qty:(b.qty===""?null:parseNum(b.qty)),exp:b.exp};
    });
    var updated={};
    Object.keys(it).forEach(function(k){updated[k]=it[k];});
    updated.counted=true;updated.countQty=qn;updated.note=note;updated.batches=batches;
    updated.photo=SB.photo||null;
    updated.by=(db.profile&&db.profile.ten)||'';updated.at=Date.now();
    var wasSeq=SB.seq,savedId=SB.itemId;
    applyItem(updated);
    if(advance){
      var flist=filteredList(p);
      var idx=-1;
      for(var j=0;j<flist.length;j++)if(flist[j].id===savedId){idx=j;break;}
      var next=null;
      for(var k2=1;k2<=flist.length;k2++){
        var cand=flist[(idx+k2)%flist.length];
        if(!cand.counted&&cand.id!==savedId){next=cand;break;}
      }
      if(next){openSheet(next.id,true);}
      else{
        A.closeSheet();
        toast("Đã kiểm xong 100% ✓ — xuất Excel để lưu hồ sơ");
      }

function showUpdateBanner(newVer){
  if(UPD_SHOWN)return;

  d.id='updbanner';
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:#2f6fed;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.2)';

function reloadLatest(ver){
  var base=location.href.split('#')[0].split('?')[0];
  location.href=base+'?v='+encodeURIComponent(ver||Date.now());
}
function checkForUpdate(){
  if(!APP_VERSION||!window.fetch||location.protocol==='file:')return;
  var base=location.href.split('#')[0].split('?')[0];
  fetch(base+'?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.text():'';})
    .then(function(t){
      var m=t&&t.match(/<meta name="app-version" content="([^"]+)"/);
      if(m&&m[1]!==APP_VERSION)showUpdateBanner(m[1]);
    })
    .catch(function(){});
}

/* Thống kê kiểm kê dùng chung: mẫu số = mã cần kiểm (tồn ≠ 0 hoặc đã kiểm); mã tồn 0 chưa kiểm không tính vào tiến độ */
function invStats(p){
  var scope=p.items.filter(function(i){return i.counted||i.close!==0;});
  var tot=scope.length,done=scope.filter(function(i){return i.counted;}).length,
    diff=scope.filter(function(i){return i.counted&&diffOf(i)!==0;}).length,
    todo=tot-done,match=done-diff;
  return {tot:tot,done:done,todo:todo,diff:diff,match:match,skip:p.items.length-tot,
    pct:tot?(todo?Math.floor(done/tot*100):100):0,
    acc:done?(diff?Math.floor(match/done*100):100):null};
}
function v2Ring(p){
  var el=document.getElementById('ringcard');if(!el)return;
  var st=invStats(p),c=2*Math.PI*36,
    accCol=st.acc===null?'#98a2b3':(st.acc>=98?'#16a34a':(st.acc>=90?'#f59e0b':'#d92d20'));
  el.innerHTML='<div class="t2">Tiến độ kiểm kê</div><div class="rg"><div class="ring"><svg viewBox="0 0 88 88"><circle class="rb" cx="44" cy="44" r="36"/><circle class="rf" cx="44" cy="44" r="36" stroke-dasharray="'+(c*st.pct/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 44 44)"/></svg><b>'+st.pct+'%</b></div>'
    +'<dl><div><dt>Đã kiểm</dt><dd style="color:#16a34a">'+st.done+'</dd></div><div><dt>Chưa kiểm</dt><dd>'+st.todo+'</dd></div>'
    +'<div><dt>Có chênh lệch</dt><dd style="color:#d92d20">'+st.diff+'</dd></div><div><dt>Tổng mã cần kiểm</dt><dd>'+st.tot+'</dd></div></dl></div>'
    +'<div class="acc"><div class="ar"><span>Tỷ lệ khớp số</span><b style="color:'+accCol+'">'+(st.acc===null?'–':st.acc+'%')+'</b></div>'
    +'<div class="bar"><i style="width:'+(st.acc===null?0:st.acc)+'%;background:'+accCol+'"></i></div>'
    +'<div class="sub">'+(st.acc===null?'Chưa có mã nào được kiểm':st.match+'/'+st.done+' mã đã kiểm khớp tồn sổ sách'+(st.diff?' · '+st.diff+' mã lệch':''))

}

var HM={m:null};

function hmStats(m){
  var ps=db.periods.filter(function(p){return p.createdAt&&hmKey(new Date(p.createdAt))===m;}),act=0,exp=0,codes=0,done=0;
  ps.forEach(function(p){p.items.forEach(function(i){

}
/* Biểu đồ đường cong mềm 6 tháng: % kiểm kê (thực tế / cuối kỳ) theo tháng; chạm vào điểm để xem tháng đó */
function hmChart(m,cur){
  var st=Math.min(cur-5,m),W=320,H=118,L=34,R=28,T=22,B=24,pts=[],i,k,s,lo=0,hi=110,vs=[];
  var N=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
  var data=[];for(i=0;i<6;i++){s=hmStats(st+i);data.push({m:st+i,pct:s.pct});if(s.pct!==null)vs.push(s.pct);}
  if(vs.length){hi=Math.ceil((Math.max(100,Math.max.apply(null,vs))+5)/10)*10;lo=Math.max(0,Math.floor((Math.min(100,Math.min.apply(null,vs))-10)/10)*10);}
  var X=function(i){return L+i*(W-L-R)/5;},Y=function(v){return T+(H-T-B)*(1-(Math.max(lo,Math.min(v,hi))-lo)/(hi-lo));};
  data.forEach(function(d,i){if(d.pct!==null)pts.push({x:X(i),y:Y(d.pct),m:d.m,pct:d.pct,i:i});});
  var out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:12px" role="img" aria-label="Biểu đồ tỷ lệ kiểm kê theo tháng">'
    +'<defs><linearGradient id="hmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4ed8" stop-opacity=".28"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(100)+'" y2="'+Y(100)+'" stroke="#9fb3d6" stroke-width="1" stroke-dasharray="4 4"/>'
    +'<text x="2" y="'+(Y(100)+3)+'" font-size="9" fill="#7a8aa8">100%</text>'
    +'<text x="2" y="'+(H-B+3)+'" font-size="9" fill="#9aa8c2">'+lo+'%</text>';
  /* đường cong Catmull-Rom → Bézier, chỉ nối các tháng liền nhau có dữ liệu */
  var segs=pts.length?[pts]:[];
  var cl=function(v){return Math.max(T,Math.min(H-B,v));};
  segs.forEach(function(sg){
    if(sg.length<2)return;
    var d='M'+sg[0].x+' '+sg[0].y;
    for(k=0;k<sg.length-1;k++){
      var p0=sg[k-1]||sg[k],p1=sg[k],p2=sg[k+1],p3=sg[k+2]||p2;
      d+=' C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+' '+cl(p1.y+(p2.y-p0.y)/6).toFixed(1)+' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+' '+cl(p2.y-(p3.y-p1.y)/6).toFixed(1)+' '+p2.x+' '+p2.y;
    }
    out+='<path d="'+d+' L'+sg[sg.length-1].x+' '+(H-B)+' L'+sg[0].x+' '+(H-B)+' Z" fill="url(#hmg)"/><path d="'+d+'" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>';
  });
  pts.forEach(function(p){
    var sel=p.m===m,lb=(Math.round(p.pct*10)/10).toLocaleString('vi-VN')+'%';
    out+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(sel?5.5:3.5)+'" fill="'+(sel?'#1d4ed8':'#fff')+'" stroke="#1d4ed8" stroke-width="2"/>'
      +'<text x="'+p.x+'" y="'+(p.y-9)+'" text-anchor="middle" font-size="'+(sel?11:9.5)+'" font-weight="'+(sel?800:600)+'" fill="'+(sel?'#1d4ed8':'#5b6b8a')+'">'+lb+'</text>';
  });
  data.forEach(function(d,i){
    var mm=((d.m%12)+12)%12,sel=d.m===m;
    out+='<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" font-weight="'+(sel?800:500)+'" fill="'+(sel?'#1d4ed8':'#7a8aa8')+'">'+N[mm]+'</text>'
      +'<rect x="'+(X(i)-24)+'" y="0" width="48" height="'+H+'" fill="transparent" onclick="A.hmSet('+d.m+')"/>';
  });
  return out+'</svg>';
}
function homeMonthCard(){
  var cur=hmKey(new Date()),m=HM.m===null?cur:Math.min(HM.m,cur),y=Math.floor(m/12),mo=m%12,s=hmStats(m),c=2*Math.PI*36;
  var pc=s.pct===null?0:Math.min(100,s.pct),lab=s.pct===null?'–':(Math.round(s.pct*10)/10).toLocaleString('vi-VN')+'%';
  var h='<div id="mcard"><div class="mh"><div class="mt">Tỷ lệ kiểm kê</div><div class="mn"><button aria-label="Tháng trước" onclick="A.hmGo(-1)">‹</button>'+(mo+1)+'/'+y+'<button aria-label="Tháng sau" onclick="A.hmGo(1)"'+(m>=cur?' disabled':'')+'>›</button></div></div>';
  h+='<div class="rg"><div class="ring"><svg viewBox="0 0 88 88"><circle class="rb" cx="44" cy="44" r="36"/><circle class="rf" cx="44" cy="44" r="36" stroke-dasharray="'+(c*pc/100)+' '+c+'" transform="rotate(-90 44 44)"/></svg><b style="font-size:'+(lab.length>4?20:25)+'px">'+lab+'</b></div>'
    +'<dl><div><dt>SL kiểm kê thực tế</dt><dd style="color:#1d4ed8">'+fmt(s.act)+'</dd></div><div><dt>SL cuối kỳ (sổ sách)</dt><dd>'+fmt(s.exp)+'</dd></div><div><dt>Chênh lệch</dt><dd style="color:'+(s.act-s.exp<0?'#d92d20':'#16a34a')+'">'+(s.act-s.exp>0?'+':'')+fmt(Math.round((s.act-s.exp)*100)/100)+'</dd></div></dl></div>';
  h+=hmChart(m,cur);
  h+='<div class="sub">'+(s.kyN?s.kyN+' kỳ vật tư · '+s.done+'/'+s.codes+' mã đã kiểm'+(s.pct!==null&&s.pct>100?' · thực tế vượt sổ sách':''):'Chưa có kỳ kiểm kê vật tư nào tạo trong tháng này')+'</div></div>';
  return h;
}
A.hmSet=function(m){
  HM.m=Math.min(hmKey(new Date()),m);var e=document.getElementById('mcard');if(e)e.outerHTML=homeMonthCard();
};
A.hmGo=function(d){
  var cur=hmKey(new Date());HM.m=Math.min(cur,(HM.m===null?cur:HM.m)+d);
  var e=document.getElementById('mcard');if(e)e.outerHTML=homeMonthCard();
};
(function(){

  renderHome=function(){
    rh.apply(this,arguments);
    var s=[].slice.call(document.querySelectorAll('#app .sec')).filter(function(e){return e.textContent.trim()==='Kiểm kê';})[0];
    if(s&&s.parentNode&&!document.getElementById('mcard'))s.parentNode.insertAdjacentHTML('beforebegin',homeMonthCard());
  };
})();
(function(){
  var ol=LKX.lock,ou=LKX.unlock,od=A.delPeriod;
  LKX.lock=function(k,id){var p=LKX.get(k,id),was=p&&p.locked;ol.apply(this,arguments);if(p&&!was&&p.locked)audit('Khoá kỳ',p.name);};
  LKX.unlock=function(k,id){var p=LKX.get(k,id),was=p&&p.locked;ou.apply(this,arguments);if(p&&was&&!p.locked)audit('Mở khoá kỳ',p.name);};
  A.delPeriod=function(id){var p=per(id),nm=p&&p.name,n=p&&p.items.length;od.apply(this,arguments);if(p&&!per(id))audit('Xoá kỳ kiểm kê',nm,{soMa:n},null);};
  var rs=renderSettings;

  };
})();

 '<button data-k="home" onclick="A.go(\'home\')">'+icon('home',24)+'Trang chủ</button>'

(function(){
  var saved=store.load();
  if(saved&&saved.periods)db=sanitizeDb(saved);
  if(store.bad){
    try{localStorage.setItem('kk_db_corrupt_'+Date.now(),store.bad);}catch(e){}
    setTimeout(function(){
      var b=document.createElement('div');b.id='badbar';
      b.style.cssText='position:fixed;left:8px;right:8px;top:70px;z-index:220;background:#fde8e8;color:#7a1218;border:1px solid #e0383d;border-radius:12px;padding:12px;font-size:13px;line-height:1.45';
      b.innerHTML='<b>Dữ liệu trên máy không đọc được.</b> App KHÔNG ghi đè và đã giữ nguyên bản gốc. Hãy tải bản gốc về để cứu dữ liệu trước khi làm gì khác.<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="pill" onclick="A.badDownload()">Tải bản gốc</button><button class="pill" onclick="A.badReset()">Bỏ bản lỗi, bắt đầu trống</button></div>';
      document.body.appendChild(b);
    },300);
  }
  if(!db.handovers)db.handovers=[];
  if(!db.explains)db.explains=[];
  migrateFolders();
  store.save();
  if(!db.counters)db.counters={};
  if(!db.profile)db.profile={ten:'',chucVu:'',chiNhanh:'',ma:'',maManual:false};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
  /* Watermark */
  try{
    var W=300,H=170;
    var c=document.createElement('canvas');
    c.width=W;c.height=H;
    var ctx=c.getContext('2d');
    ctx.translate(W/2,H/2);
    ctx.rotate(-28*Math.PI/180);
    ctx.font='12.5px Arial,sans-serif';
    ctx.fillStyle='rgba(0,0,0,0.072)';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('Mai Văn Quyết quyetmv',0,0);
    var url=c.toDataURL('image/png');
    var wm=document.createElement('div');
    wm.style.cssText='position:fixed;inset:0;z-index:9000;pointer-events:none;background-image:url('+url+');background-repeat:repeat;background-size:'+W+'px '+H+'px';
    document.body.appendChild(wm);
  }catch(e){}
})();
</script>
